<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img"><title>퍼센트(%)와 퍼센트포인트(%p) 차이</title><desc>금리 3%에서 4%는 1%p 상승이자 33% 상승</desc><rect width="800" height="390" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">퍼센트(%)와 퍼센트포인트(%p) 차이</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">상황</text><text x="300" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">퍼센트포인트</text><text x="540" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">퍼센트</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">금리 3% → 4%</text><text x="300" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1%p 상승</text><text x="540" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">33% 상승</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">지지율 40% → 44%</text><text x="300" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4%p 상승</text><text x="540" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">10% 상승</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">할인 20% → 30%</text><text x="300" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">10%p 추가 할인</text><text x="540" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">총 할인 50%가 아님</text><text x="40" y="316" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">뉴스에서 %p와 %가 섞여 나올 때 이 차이를 알면 숫자를 정확히 읽을 수 있어요.</text><text x="40" y="360" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>