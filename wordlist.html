  // ---- ?쇰낯??(Worker) ----
  function ensureJaWorker() {
    if (jaWorker) return;
    const code = `
      self.importScripts("https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js");
      let tokenizer = null;
      kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/" }).build(function(err, t) {
        if (err) { postMessage({ type: 'init-error', message: String(err) }); return; }
        tokenizer = t;
        postMessage({ type: 'ready' });
      });
      onmessage = function(e) {
        if (e.data.type !== 'tokenize' || !tokenizer) return;
        const tokens = tokenizer.tokenize(e.data.text).map(function(t) {
          return { surface: t.surface_form, basic: t.basic_form, pos: t.pos, pos1: t.pos_detail_1, reading: t.reading || '' };
        });
        postMessage({ type: 'tokens', id: e.data.id, tokens: tokens });
      };
    `;
    const blob = new Blob([code], { type: 'application/javascript' });
    jaWorker = new Worker(URL.createObjectURL(blob));
    jaWorker.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'ready') { jaReady = true; status.textContent = '?쇰낯???ъ쟾 以鍮??꾨즺'; setTimeout(() => { status.textContent = ''; }, 1500); if (pendingJa) { runJa(pendingJa); pendingJa = null; } }
      else if (d.type === 'init-error') { status.textContent = '?쇰낯???ъ쟾 濡쒕뵫???ㅽ뙣?덉뼱?? ?덈줈怨좎묠 ???ㅼ떆 ?쒕룄?댁＜?몄슂.'; extractBtn.disabled = false; }
      else if (d.type === 'tokens') { renderRows(buildJaRows(d.tokens), 'ja'); extractBtn.disabled = false; status.textContent = ''; }
    };
    jaWorker.onerror = () => { status.textContent = '?쇰낯???ъ쟾 濡쒕뵫???ㅽ뙣?덉뼱??'; extractBtn.disabled = false; };
  }

  let pendingJa = null;
  function runJa(text) { jaWorker.postMessage({ type: 'tokenize', id: Date.now(), text }); }

  function buildJaRows(tokens) {
    const minLen = parseInt(minLenInput.value, 10) || 1;
    const KEEP_POS = new Set(['?띹찠', '?뺠찠', '壤℡?屋?, '??찠']);
    const SKIP_DETAIL = new Set(['??, '?욆눎塋?, '?ε갼', '餓ｅ릫屋?, '?η텥屋욅쉪', '??찠??꺗']);
    const counts = new Map();
    for (const t of tokens) {
      if (!KEEP_POS.has(t.pos)) continue;
      if (SKIP_DETAIL.has(t.pos1)) continue;
      const base = (t.basic && t.basic !== '*') ? t.basic : t.surface;
      if (!base || /^[\s\d\p{P}\p{S}]+$/u.test(base)) continue;
      if (base.length < minLen) continue;
      if (skipStop.checked && JA_STOP.has(base)) continue;
      const cur = counts.get(base) || { count: 0, reading: '' };
      cur.count += 1;
      if (!cur.reading && t.reading && t.reading !== '*') cur.reading = katakanaToHiragana(t.reading);
      counts.set(base, cur);
    }
    return [...counts.entries()]
      .map(([word, v]) => ({ word, count: v.count, reading: v.reading }))
      .sort((a, b) => b.count - a.count || a.word.localeCompare(b.word, 'ja'));
  }

  // ---- ?뚮뜑 & ?ㅼ슫濡쒕뱶 ----
  function renderRows(rows, lang) {
    lastRows = rows;
    lastLang = lang;
    if (rows.length === 0) {
      result.innerHTML = '<div class="empty-state">異붿텧???⑥뼱媛 ?놁뼱?? 議곌굔??議곗젙?대낫?몄슂.</div>';
      return;
    }
    const total = rows.reduce((s, r) => s + r.count, 0);
    let html = `<div class="summary-row"><span>怨좎쑀 ?⑥뼱 ${rows.length}媛?쨌 珥?異쒗쁽 ${total}??쨌 ${lang === 'ja' ? '?쇰낯?? : '?곸뼱'}</span>
      <div class="download-row">
        <button class="btn-ghost" id="dlVocab">?⑥뼱??CSV ?대젮諛쏄린</button>
        <button class="btn-ghost" id="dlFreq">鍮덈룄??CSV ?대젮諛쏄린</button>
      </div></div>`;
    html += '<table><thead><tr><th>#</th><th>?⑥뼱</th>' + (lang === 'ja' ? '<th>?쎄린</th>' : '') + '<th>?잛닔</th><th></th></tr></thead><tbody>';
    rows.forEach((r, i) => {
      html += `<tr data-i="${i}"><td class="num">${i + 1}</td><td>${r.word}</td>` + (lang === 'ja' ? `<td class="reading">${r.reading}</td>` : '') + `<td class="count">${r.count}</td><td class="remove"><button title="紐⑸줉?먯꽌 ?쒖쇅">횞</button></td></tr>`;
    });
    html += '</tbody></table>';
    result.innerHTML = html;

    result.querySelectorAll('td.remove button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tr = e.target.closest('tr');
        const idx = parseInt(tr.dataset.i, 10);
        lastRows.splice(idx, 1);
        renderRows(lastRows, lastLang);
      });
    });
    document.getElementById('dlVocab').addEventListener('click', () => downloadCsv('vocab'));
    document.getElementById('dlFreq').addEventListener('click', () => downloadCsv('freq'));
  }

  function csvCell(s) {
    s = String(s ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function downloadCsv(kind) {
    let lines;
    if (kind === 'freq') {
      lines = lastRows.map(r => [r.word, r.count].map(csvCell).join(','));
    } else if (lastLang === 'ja') {
      // ?쇰낯?는룸쑜쨌?쎄린(?덈씪媛??
      lines = lastRows.map(r => [r.word, '', r.reading].map(csvCell).join(','));
    } else {
      // ?⑥뼱쨌??      lines = lastRows.map(r => [r.word, ''].map(csvCell).join(','));
    }
    const bom = '\uFEFF';
    const blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (kind === 'freq' ? 'word_frequency' : 'wordlist') + '_' + lastLang + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    if (typeof gtag === 'function') gtag('event', 'wordlist_csv_downloaded', { kind, lang: lastLang, rows: lastRows.length });
  }

  extractBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) { result.innerHTML = '<div class="empty-state">吏臾몄쓣 癒쇱? ?낅젰?댁＜?몄슂</div>'; return; }
    let lang = langSelect.value;
    if (lang === 'auto') lang = detectLang(text);

    if (typeof gtag === 'function') gtag('event', 'wordlist_extracted', { lang, chars: text.length });

    if (lang === 'en') {
      renderRows(extractEnglish(text), 'en');
      return;
    }
    extractBtn.disabled = true;
    ensureJaWorker();
    if (jaReady) { runJa(text); }
    else { pendingJa = text; status.textContent = '?쇰낯???ъ쟾??遺덈윭?ㅻ뒗 以묒씠?먯슂??(泥섏쓬 ??踰덈쭔, 理쒕? 30珥?'; }
  });
</script>
