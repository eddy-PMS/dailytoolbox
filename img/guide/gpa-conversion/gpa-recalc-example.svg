<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img"><title>과목별로 다시 매기면 (더 정확)</title><desc>A+ 둘, A0 하나, B+ 둘이면 4.5 만점 4.00, 4.3 만점으로 다시 매기면 3.84</desc><rect width="800" height="390" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">과목별로 다시 매기면 (더 정확)</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">3학점 다섯 과목: A+ 둘, A0 하나, B+ 둘</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산 방식</text><text x="290" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">식</text><text x="640" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">결과</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4.5 만점 평점</text><text x="290" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">(4.5×2 + 4.0 + 3.5×2) ÷ 5</text><text x="640" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4.00</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4.3 만점으로 다시</text><text x="290" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">(4.3×2 + 4.0 + 3.3×2) ÷ 5</text><text x="640" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.84</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">단순 비례</text><text x="290" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.00 × 4.3 ÷ 4.5</text><text x="640" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.82</text><text x="40" y="360" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>