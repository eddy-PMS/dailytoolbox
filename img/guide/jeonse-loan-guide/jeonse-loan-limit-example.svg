<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 594" role="img"><title>보증금 3억원 전세, 얼마까지 나올까</title><desc>수도권 보증금 3억원 전세를 HF 보증으로 계약하면 약 2.13억원</desc><rect width="800" height="594" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">보증금 3억원 전세, 얼마까지 나올까</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">수도권 · 무주택 · HF 보증 기준</text><rect x="40" y="120" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="154" r="20" fill="#2b5fd9"/><text x="80" y="161" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="160" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">과목별 한도</text><text x="118" y="192" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4억원</text><rect x="40" y="224" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="258" r="20" fill="#2b5fd9"/><text x="80" y="265" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="264" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">소요자금 한도</text><text x="118" y="296" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3억원 × 80% = 2.4억원</text><rect x="40" y="328" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="362" r="20" fill="#2b5fd9"/><text x="80" y="369" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="368" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">상환능력 한도</text><text x="118" y="400" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">소득과 기존 부채로 산정(사람마다 다름)</text><rect x="40" y="432" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="466" r="20" fill="#2b5fd9"/><text x="80" y="473" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="472" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">가장 작은 금액 × 8/9</text><text x="118" y="504" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2.4억원이 가장 작다면 약 2.13억원</text><text x="40" y="564" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>