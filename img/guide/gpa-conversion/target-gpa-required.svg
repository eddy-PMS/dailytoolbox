<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" role="img"><title>목표 평점까지 남은 학기에 필요한 평점</title><desc>현재 60학점 평점 3.3에서 전체 3.5를 만들려면 남은 30학점에 3.9가 필요</desc><rect width="800" height="616" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">목표 평점까지 남은 학기에 필요한 평점</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">(목표 × 총 학점 − 현재 × 현재 학점) ÷ 남은 학점</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 현재 60학점 평점 3.3, 남은 30학점, 목표 3.5</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">(3.5 × 90 − 3.3 × 60) ÷ 30 = 3.9</text><rect x="40" y="248" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="277" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">현재 평점</text><text x="250" y="277" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">필요한 평점</text><text x="450" y="277" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">4.5 만점에서</text><rect x="40" y="292" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="324" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.0</text><text x="250" y="324" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.5</text><text x="450" y="324" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전 과목 A+ 여야 가능</text><rect x="40" y="342" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="374" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.1</text><text x="250" y="374" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.3</text><text x="450" y="374" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">거의 전부 A+</text><rect x="40" y="392" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="424" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.2</text><text x="250" y="424" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.1</text><text x="450" y="424" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">A0~A+</text><rect x="40" y="442" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="474" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.3</text><text x="250" y="474" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3.9</text><text x="450" y="474" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">대부분 A0</text><rect x="40" y="492" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="524" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.4</text><text x="250" y="524" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3.7</text><text x="450" y="524" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">B+와 A0 사이</text><text x="40" y="586" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>