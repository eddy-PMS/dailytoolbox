<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img"><title>학년별 외우는 순서</title><desc>고1은 구멍 메우기, 고2는 지문 속 단어로, 고3은 목록 줄이기</desc><rect width="800" height="540" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">학년별 외우는 순서</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고1 — 구멍 메우기</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">중학 구간까지의 2,000개 확인</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">모르는 것만 모아 목록으로 (대개 300~600개)</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고2 — 지문 속 단어로 바꾸기</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">모의고사 틀린 지문에서 단어 뽑기</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">두 번 이상 나온 단어 따로 표시</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고3 — 목록을 줄이는 시기</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">늘리지 않고 줄여요</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">10월에는 틀린 것만 남은 목록으로 압축</text><text x="40" y="510" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>