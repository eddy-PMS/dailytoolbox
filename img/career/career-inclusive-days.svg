<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img"><title>입사일·퇴사일, 포함하나 빼나</title><desc>입사일·퇴사일을 포함해 세면 2024-05-10~2026-05-09는 2년 0개월 0일, 빼면 1년 11개월 29일</desc><rect width="800" height="424" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">입사일·퇴사일, 포함하나 빼나</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">이 계산기는 둘 다 포함(초일 산입)</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">입사일</text><text x="190" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">퇴사일</text><text x="340" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">포함해서</text><text x="560" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">빼고</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2026-01-01</text><text x="190" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2026-01-31</text><text x="340" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1개월 0일 (31일)</text><text x="560" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">0개월 30일 (30일)</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2023-03-02</text><text x="190" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2026-03-01</text><text x="340" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3년 0개월 0일</text><text x="560" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2년 11개월 27일</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2024-05-10</text><text x="190" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2026-05-09</text><text x="340" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2년 0개월 0일</text><text x="560" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1년 11개월 29일</text><text x="40" y="350" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">하루 차이로 “2년”이 “1년 11개월”이 될 수 있어요. 기준은 받는 기관을 따라요.</text><text x="40" y="394" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>