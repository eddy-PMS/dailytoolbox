<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>할인 표현별 실제 할인율</title><desc>30%+10% 쿠폰은 37%, 50%+20% 쿠폰은 60%, 1+1은 50%, 2+1은 33.3%</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">할인 표현별 실제 할인율</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">표현</text><text x="400" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">실제 할인율</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">30% + 10% 쿠폰</text><text x="400" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">37%</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">50% + 20% 쿠폰</text><text x="400" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">60%</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1+1 (두 개 사면 하나 무료)</text><text x="400" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50% (2개 구매 시)</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2+1</text><text x="400" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">33.3%</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">10만원 이상 1만원 할인</text><text x="400" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">최대 10% (구매액 클수록 낮아짐)</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">중복 할인은 더하지 않고 곱해요: 30% 후 10% 쿠폰이면 1 − 0.7 × 0.9 = 37%</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>