<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>지문에서 단어를 뽑는 세 가지 기준</title><desc>문장 뜻이 끊긴 단어, 두 번 이상 본 단어, 선택지에 있던 단어</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">지문에서 단어를 뽑는 세 가지 기준</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">몰라서 문장 뜻이 끊긴 단어</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">넘어가도 뜻이 통한 단어는 급하지 않아요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">두 번 이상 본 단어</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">다른 지문에서 또 나왔다면 다시 나와요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">선택지에 있던 단어</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">선택지 단어가 정오를 가르는 경우가 많아요</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>