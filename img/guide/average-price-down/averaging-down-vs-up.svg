<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" role="img"><title>물타기와 불타기의 차이</title><desc>물타기는 떨어진 뒤 사서 평단이 내려가고, 불타기는 오른 뒤 사서 평단이 올라간다</desc><rect width="800" height="464" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">물타기와 불타기의 차이</text><rect x="40" y="86" width="720" height="146" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">물타기 — 떨어진 뒤 추가 매수</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">평단가가 내려간다</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">좋아지는 것: 본전까지 필요한 상승률</text><text x="118" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">나빠지는 것: 더 떨어질 때 손실 금액</text><rect x="40" y="246" width="720" height="146" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="280" r="20" fill="#2b5fd9"/><text x="80" y="287" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="286" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">불타기 — 오른 뒤 추가 매수</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">평단가가 올라간다</text><text x="118" y="346" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">좋아지는 것: 오를 때 늘어나는 수익 금액</text><text x="118" y="374" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">나빠지는 것: 되돌릴 때 본전·손실로 바뀌는 속도</text><text x="40" y="434" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>