<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>사다리 말고 다른 뽑기 방법</title><desc>사다리타기는 과정이 보이고, 랜덤 뽑기는 가장 단순, 팀 나누기는 N개 팀 배분</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">사다리 말고 다른 뽑기 방법</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">방법</text><text x="230" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">특징</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">사다리타기</text><text x="230" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">과정이 보여 재미있음, 결과 일대일 대응</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">랜덤 뽑기</text><text x="230" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">가장 단순, 여러 명 뽑기·순서 섞기 가능</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">팀 나누기</text><text x="230" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">인원을 N개 팀으로 무작위 배분</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">로또 번호</text><text x="230" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1~45 숫자 뽑기</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>