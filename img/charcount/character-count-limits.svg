<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>자주 쓰는 글자수 기준</title><desc>대기업 자소서 공백 포함 500~1,000자, 인스타그램 캡션 2,200자, X 280자</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">자주 쓰는 글자수 기준</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">용도</text><text x="330" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">일반적인 기준</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">대기업 자기소개서</text><text x="330" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">공백 포함 500~1,000자 / 항목</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">공무원·공기업 자소서</text><text x="330" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">공백 포함 또는 바이트(2,000~3,000)</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">인스타그램 캡션</text><text x="330" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2,200자</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">X(트위터)</text><text x="330" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">280자 (한글도 동일)</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">원고지 매수</text><text x="330" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">200자 원고지 기준, 공백 포함</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">제출처마다 기준이 달라요. 공고의 기준을 먼저 확인하세요.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>