<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="keywords" content="타자 속도 테스트, 타자 연습, 분당 타수, 한글 타자 테스트, 영문 타자 wpm, 타자 측정">
<link rel="canonical" href="https://dailyfreetoolbox.com/typing.html">
<meta property="og:type" content="website">
<meta property="og:title" content="타자 속도 테스트">
<meta property="og:description" content="한글·영문 예문을 따라 치면 분당 타수(타/분)와 WPM, 정확도를 측정하는 무료 타자 연습 도구.">
<meta property="og:url" content="https://dailyfreetoolbox.com/typing.html">

<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebApplication", "name": "타자 속도 테스트", "url": "https://dailyfreetoolbox.com/typing.html", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW"}, "description": "한글·영문 예문을 따라 치면 분당 타수(타/분)와 WPM, 정확도를 측정하는 무료 타자 연습 도구."}
</script>
<script src="common.js"></script>
<link rel="stylesheet" href="tool.css">
<style>:root { --accent:#3b6d8a; --accent-deep:#2a5168; }</style>

</head>
<body>

<nav id="site-nav" data-accent="#3b6d8a"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>⌨ 타자 속도 테스트</b></div>
  <h1>타자 속도 테스트</h1>
  <p class="tagline">지금 내 타수는 몇 타일까요</p>
  <p class="sub">예문을 따라 입력하면 분당 타수와 정확도를 계산해요. 한글은 자모 단위 타수, 영문은 타수와 WPM을 함께 보여드려요.</p>

  <div class="card">
    <div class="tabs"><button class="tab active" data-l="ko">한글</button><button class="tab" data-l="en">영문</button></div>
    <div id="sample" style="font-size:18px;line-height:1.9;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:12px;user-select:none"></div>
    <textarea id="input" placeholder="여기에 위 문장을 그대로 입력하세요. 첫 글자를 치는 순간 시간이 시작돼요." style="min-height:110px;font-size:17px" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row" style="margin:10px 0 0"><span id="live"></span><button class="btn-ghost" id="next" style="margin-left:auto">다른 문장</button></div>
  </div>
  <div id="result"></div>
 
  <footer>한글 타수는 자모 단위(초성·중성·종성, 겹자모는 2타)로 계산하며, 흔히 쓰는 타자연습 프로그램과 비슷한 기준이에요.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
const KO=['가장 큰 위험은 아무 위험도 감수하지 않는 것이다. 빠르게 변하는 세상에서 실패가 보장된 유일한 전략은 위험을 감수하지 않는 것이다.','오늘 할 수 있는 일을 내일로 미루지 마라. 작은 습관이 쌓여 큰 차이를 만들고, 꾸준함은 재능을 이긴다.','여행은 목적지에 도착하는 것이 아니라 길 위에서 보내는 시간 그 자체다. 낯선 곳에서 우리는 자신을 새롭게 발견한다.','책을 읽는다는 것은 다른 사람의 머리로 생각하는 연습이다. 좋은 책 한 권은 좋은 친구 열 명보다 낫다.','성공은 매일 반복되는 작은 노력의 합이다. 어제보다 나은 오늘을 만드는 것, 그것이 전부다.'];
const EN=['The quick brown fox jumps over the lazy dog while the sun sets slowly behind the mountains.','Success is not final, failure is not fatal. It is the courage to continue that counts in the end.','Practice makes progress, not perfection. Every small step forward is still a step in the right direction.','Technology is best when it brings people together and makes everyday life a little easier for everyone.','Do not watch the clock. Do what it does and keep going, one steady second at a time.'];
let lang='ko', text='', t0=null, done=false, tick=null;
function strokes(s){ let n=0; for(const ch of s){ const c=ch.charCodeAt(0)-0xAC00; if(c>=0&&c<=11171){ const cho=Math.floor(c/588), jung=Math.floor(c%588/28), jong=c%28; n+=1; n+= [9,10,11,14,15,16,19].includes(jung)?2:1; if(jong){ n+= [3,5,6,9,10,11,12,13,14,15,18].includes(jong)?2:1; } } else if(ch.trim()) n+=1; else n+=1; } return n; }
function pick(){ const arr=lang==='ko'?KO:EN; text=arr[Math.floor(Math.random()*arr.length)]; $('sample').textContent=text; $('input').value=''; t0=null; done=false; $('result').innerHTML=''; $('live').textContent=''; clearInterval(tick); $('input').focus(); }
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');lang=b.dataset.l;pick();}));
$('next').addEventListener('click',pick);
function stats(){ const v=$('input').value; const sec=(performance.now()-t0)/1000; const min=Math.max(sec/60,1/600);
  let correct=0; for(let i=0;i<v.length;i++){ if(v[i]===text[i]) correct++; } const acc= v.length? Math.round(correct/v.length*100):100;
  const tasu=Math.round(strokes(v)/min); const wpm=Math.round((v.length/5)/min); return {sec,acc,tasu,wpm,len:v.length}; }
$('input').addEventListener('input',()=>{
  if(done) return; if(t0===null){ t0=performance.now(); tick=setInterval(()=>{ const s=stats(); $('live').textContent=`${s.sec.toFixed(1)}초 · ${s.tasu}타/분 · 정확도 ${s.acc}%`; },250); }
  const v=$('input').value;
  if(v.length>=text.length){ done=true; clearInterval(tick); const s=stats();
    $('result').innerHTML=`<div class="stat-grid"><div class="stat"><div class="num">${s.tasu}</div><div class="label">타/분</div></div>${lang==='en'?`<div class="stat"><div class="num">${s.wpm}</div><div class="label">WPM</div></div>`:''}<div class="stat"><div class="num">${s.acc}%</div><div class="label">정확도</div></div><div class="stat"><div class="num">${s.sec.toFixed(1)}s</div><div class="label">소요 시간</div></div></div><div class="note" style="text-align:center">${s.tasu>=600?'매우 빠름':s.tasu>=400?'빠름':s.tasu>=250?'보통':'연습하면 금방 늘어요'} · "다른 문장"으로 다시 도전</div>`;
    $('live').textContent='완료!'; if(typeof gtag==='function') gtag('event','typing_test_done',{lang,tasu:s.tasu,acc:s.acc}); }
});
pick();
 
</script>

</body>
</html>
