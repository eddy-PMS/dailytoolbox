<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" role="img"><title>교육과정 기본 어휘 3,000개</title><desc>초등 800, 중학~고1 1,200, 고2~고3 1,000 — 누적 3,000개</desc><rect width="800" height="328" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">교육과정 기본 어휘 3,000개</text><text x="40" y="118" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">초등학교</text><rect x="210" y="96" width="82.7" height="30" rx="6" fill="#2b5fd9"/><text x="304.6666666666667" y="118" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">800개 (+800)</text><text x="40" y="166" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">중학교 ~ 고1</text><rect x="210" y="144" width="206.7" height="30" rx="6" fill="#2b5fd9"/><text x="428.66666666666663" y="166" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">2,000개 (+1,200)</text><text x="40" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">고2 ~ 고3</text><rect x="210" y="192" width="310.0" height="30" rx="6" fill="#2b5fd9"/><text x="532.0" y="214" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">3,000개 (+1,000)</text><text x="40" y="254" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">막대 길이는 누적 단어 수, 괄호는 그 구간에서 새로 더해지는 수</text><text x="40" y="298" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>