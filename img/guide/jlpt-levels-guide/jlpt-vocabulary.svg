-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N1</text><text x="300" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 10,000</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">공식 발표값이 아니라 통상 알려진 값이에요.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>