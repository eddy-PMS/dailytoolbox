<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" role="img"><title>버팀목(일반) 금리표</title><desc>버팀목(일반) 금리는 소득과 보증금 구간에 따라 연 2.5~3.5%</desc><rect width="800" height="474" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">버팀목(일반) 금리표</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">부부합산 연소득 × 보증금 구간</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">부부합산 연소득</text><text x="260" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">보증금 5천만원 이하</text><text x="470" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">5천만~1억원</text><text x="630" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">1억원 초과</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2천만원 이하</text><text x="260" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2.5%</text><text x="470" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2.6%</text><text x="630" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2.7%</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2천만~4천만원</text><text x="260" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2.7%</text><text x="470" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2.8%</text><text x="630" y="248" font-size="18" font-weight="400" 