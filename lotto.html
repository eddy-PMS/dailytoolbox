<title>로또 번호 생성기 - 무작위 로또 번호 추천, 여러 게임 한번에</title>
<meta name="description" content="1~45 중 6개를 무작위로 뽑아주는 로또 번호 생성기. 포함할 번호·제외할 번호 지정, 최대 10게임 동시 생성, 공 색깔 표시.">
<meta name="keywords" content="로또 번호 생성기, 로또 번호 추천, 로또 자동 번호, 로또 번호 뽑기, 로또 랜덤 번호, 로또 645">

<meta property="og:type" content="website">

<meta property="og:description" content="1~45 중 6개를 무작위로 뽑아주는 로또 번호 생성기. 포함할 번호·제외할 번호 지정, 최대 10게임 동시 생성, 공 색깔 표시.">

<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebApplication", "name": "로또 번호 생성기", "url": "https://dailyfreetoolbox.com/lotto.html", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW"}, "description": "1~45 중 6개를 무작위로 뽑아주는 로또 번호 생성기. 포함할 번호·제외할 번호 지정, 최대 10게임 동시 생성, 공 색깔 표시."}
</script>
<script src="common.js"></script>
<link rel="stylesheet" href="tool.css">
<style>:root { --accent:#b8823a; --accent-deep:#8a5f25; }</style>

</head>
<body>

<nav id="site-nav" data-accent="#b8823a"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>🎱 로또 번호 생성기</b></div>
  <h1>이번 주 번호, 운에 맡겨볼까요</h1>
  <p class="sub">완전 무작위로 6개를 뽑아요. 꼭 넣고 싶은 번호나 빼고 싶은 번호를 정할 수 있고, 최대 10게임까지 한 번에 만들 수 있어요.</p>

  <div class="card">
    <div class="row"><label>게임 수 <input class="inline" type="number" id="n" value="5" min="1" max="10" style="width:60px"></label>
      <label>고정 번호 <input class="inline" type="text" id="fix" placeholder="예: 7, 21" style="width:120px"></label>
      <label>제외 번호 <input class="inline" type="text" id="ex" placeholder="예: 4, 13" style="width:120px"></label>
      <label><input type="checkbox" id="sorted" checked> 정렬</label></div>
    <div class="btn-row"><button class="btn" id="go">번호 생성</button><button class="btn-ghost" id="copy">복사</button></div>
    <div id="out" style="margin-top:14px"></div>
  </div>
 
  <footer>무작위 번호는 당첨 확률을 높이지 않아요(모든 조합의 확률은 같아요). 로또는 재미로, 무리하지 않게.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
const color=n=>n<=10?'#f2c94c':n<=20?'#6fa8dc':n<=30?'#e06666':n<=40?'#999':'#6aa84f';
const parse=s=>[...new Set(s.split(/[,\s]+/).map(x=>+x).filter(x=>x>=1&&x<=45))];
let games=[];
function gen(){
  const n=Math.min(10,Math.max(1,+$('n').value||1)), fix=parse($('fix').value).slice(0,5), ex=parse($('ex').value).filter(x=>!fix.includes(x));
  const pool=[]; for(let i=1;i<=45;i++){ if(!fix.includes(i)&&!ex.includes(i)) pool.push(i); }
  if(pool.length<6-fix.length){ $('out').innerHTML='<div class="empty bad">제외 번호가 너무 많아요</div>'; return; }
  games=[]; for(let g=0;g<n;g++){ const p=pool.slice(); const pick=fix.slice(); while(pick.length<6){ const i=Math.floor(Math.random()*p.length); pick.push(p.splice(i,1)[0]); } if($('sorted').checked) pick.sort((a,b)=>a-b); games.push(pick); }
  $('out').innerHTML=games.map((g,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--paper-deep)"><span style="width:28px;font-size:12px;color:var(--ink-soft)">${String.fromCharCode(65+i)}</span>${g.map(x=>`<span style="width:36px;height:36px;border-radius:50%;background:${color(x)};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)">${x}</span>`).join('')}</div>`).join('');
  if(typeof gtag==='function') gtag('event','lotto_generated',{n});
}
$('go').addEventListener('click',gen);
$('copy').addEventListener('click',async()=>{ if(!games.length) return; try{ await navigator.clipboard.writeText(games.map((g,i)=>String.fromCharCode(65+i)+': '+g.join(', ')).join('\n')); $('copy').textContent='복사됨'; setTimeout(()=>$('copy').textContent='복사',1500);}catch{} });
gen();
 
</script>

</body>
</html>
