<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img"><title>한글은 몇 바이트인가</title><desc>UTF-8은 한글 1자 3바이트, EUC-KR은 2바이트, 영문·숫자는 1바이트</desc><rect width="800" height="340" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">한글은 몇 바이트인가</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">인코딩</text><text x="220" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">한글 1자</text><text x="400" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">영문·숫자 1자</text><text x="600" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">“한글” 2자</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">UTF-8</text><text x="220" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3바이트</text><text x="400" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1바이트</text><text x="600" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">6바이트</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">EUC-KR</text><text x="220" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2바이트</text><text x="400" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1바이트</text><text x="600" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4바이트</text><text x="40" y="266" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">채용 사이트마다 기준이 달라 “바이트” 제한이면 어느 기준인지 확인하세요.</text><text x="40" y="310" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>