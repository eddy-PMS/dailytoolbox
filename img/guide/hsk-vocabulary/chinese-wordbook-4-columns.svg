<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img"><title>중국어 단어장은 네 칸</title><desc>중국어 단어장은 한자·병음·성조·뜻 네 칸</desc><rect width="800" height="340" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">중국어 단어장은 네 칸</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">한자</text><text x="200" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">병음</text><text x="370" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">성조</text><text x="540" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">뜻</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">买</text><text x="200" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">mǎi</text><text x="370" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3성</text><text x="540" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">사다</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">卖</text><text x="200" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">mài</text><text x="370" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4성</text><text x="540" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">팔다</text><text x="40" y="266" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">성조는 기호(ǎ)와 숫자(3)를 같이 적어 두면 따로 복습하기 쉬워요.</text><text x="40" y="310" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>