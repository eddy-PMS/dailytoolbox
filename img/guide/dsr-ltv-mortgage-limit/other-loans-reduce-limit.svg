<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img"><title>기존 대출이 있으면 한도가 줄어요</title><desc>자동차 할부 2,000만원이면 한도 약 5,800만원, 신용대출 3,000만원이면 약 9,400만원 감소</desc><rect width="800" height="390" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">기존 대출이 있으면 한도가 줄어요</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">연봉 6,000만원 · 수도권·규제지역(계산 금리 7.0%) · 30년</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">기존 대출</text><text x="430" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">주담대 한도</text><text x="620" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">줄어드는 금액</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">없음</text><text x="430" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 3억 100만원</text><text x="620" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">—</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">자동차 할부 2,000만원 (연 6%, 5년)</text><text x="430" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 2억 4,300만원</text><text x="620" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 5,800만원</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">신용대출 3,000만원 (연 5%)</text><text x="430" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 2억 700만원</text><text x="620" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 9,400만원</text><text x="40" y="360" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>