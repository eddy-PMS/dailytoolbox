<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img"><title>평점(GPA) 계산 방법</title><desc>평점은 성적 점수에 이수 학점을 곱해 더한 뒤 총 학점으로 나눈 값. 예: (4.5×3 + 3.0×2) ÷ 5 = 3.9</desc><rect width="800" height="330" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">평점(GPA) 계산 방법</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">평점 = Σ(성적 점수 × 학점) ÷ 총 이수 학점</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 3학점 A+(4.5), 2학점 B0(3.0)</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">(4.5×3 + 3.0×2) ÷ 5 = 3.9</text><text x="40" y="256" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">P/F 과목은 학점에 넣지 않고, F는 0점으로 계산해요. 누적 평점도 학점 가중 평균이에요.</text><text x="40" y="300" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>