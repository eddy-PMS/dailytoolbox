<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 588" role="img"><title>허용 범위와 가장자리 설정</title><desc>허용 범위는 흰 배경 30~60, 가장자리 부드럽게 10~20, 지우는 방식 두 가지</desc><rect width="800" height="588" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">허용 범위와 가장자리 설정</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">허용 범위</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">낮으면 배경에 얼룩, 높으면 피사체 밝은 부분까지 지워짐</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">흰 배경은 보통 30~60</text><rect x="40" y="218" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">가장자리 부드럽게</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">0이면 테두리가 계단처럼 거칠고, 10~20이면 자연스러움</text><rect x="40" y="322" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="356" r="20" fill="#2b5fd9"/><text x="80" y="363" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="362" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">가장자리에서 이어진 배경만</text><text x="118" y="394" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">바깥쪽에서 연결된 부분만 — 피사체 안에 구멍이 안 뚫림</text><rect x="40" y="426" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="460" r="20" fill="#2b5fd9"/><text x="80" y="467" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="466" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">비슷한 색 전부</text><text x="118" y="498" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">도장 안쪽 빈 공간까지 비치게 할 때</text><text x="40" y="558" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>