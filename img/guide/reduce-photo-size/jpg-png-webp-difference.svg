<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img"><title>JPG · PNG · WEBP 차이</title><desc>JPG는 일반 사진, PNG는 스크린샷·로고, WEBP는 웹사이트용</desc><rect width="800" height="540" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">JPG · PNG · WEBP 차이</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">JPG — 손실 (품질 조절 가능)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">투명 배경 안 됨 · 풍경·인물 등 일반 사진</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">주의: 저장을 반복하면 조금씩 뭉개져요</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">PNG — 무손실</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">투명 배경 됨 · 스크린샷, 로고, 글자·도면</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">주의: 사진을 넣으면 용량이 커요</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">WEBP — 손실 (품질 조절 가능)</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">투명 배경 됨 · 블로그·웹사이트용</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">주의: 접수 시스템이 받지 않는 곳이 있어요</text><text x="40" y="510" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>