<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>긴 변을 줄이면 픽셀 수는</title><desc>긴 변을 4000px에서 1920px로 줄이면 픽셀 수가 약 23%</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">긴 변을 줄이면 픽셀 수는</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">긴 변 (최대 크기)</text><text x="300" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">줄인 뒤 크기</text><text x="560" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">원본 대비</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4000px (원본)</text><text x="300" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4000×3000</text><text x="560" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">100%</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2560px</text><text x="300" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2560×1920</text><text x="560" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 41%</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1920px</text><text x="300" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1920×1440</text><text x="560" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 23%</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1200px</text><text x="300" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1200×900</text><text x="560" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">9%</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">800px</text><text x="300" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">800×600</text><text x="560" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4%</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>