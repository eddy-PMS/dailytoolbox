<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" role="img"><title>증감률은 처음 값이 기준</title><desc>증감률은 처음 값이 기준. 100에서 50은 -50%, 50에서 100은 +100%</desc><rect width="800" height="346" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">증감률은 처음 값이 기준</text><rect x="40.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">100 → 50</text><text x="216.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">−50%</text><text x="216.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">처음 값 100 기준</text><rect x="407.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">50 → 100</text><text x="583.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">+100%</text><text x="583.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">처음 값 50 기준</text><text x="40" y="246" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">같은 50 차이여도 방향에 따라 퍼센트가 달라요.</text><text x="40" y="272" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">계산기에는 처음 값 → 나중 값 순서로 넣으세요.</text><text x="40" y="316" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>