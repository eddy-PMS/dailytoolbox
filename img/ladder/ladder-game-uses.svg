<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>상황별 결과 칸에 넣을 것</title><desc>커피 내기는 당첨 한 칸, 발표 순서는 첫 번째·두 번째, 청소 당번은 요일</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">상황별 결과 칸에 넣을 것</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">쓰는 곳</text><text x="260" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">결과 칸에 넣을 것</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">커피 내기</text><text x="260" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">당첨 (나머지는 비워 두면 꽝)</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">발표 순서</text><text x="260" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">첫 번째, 두 번째, 세 번째 …</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">청소 당번</text><text x="260" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">월, 화, 수, 목, 금</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">자리 정하기</text><text x="260" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">창가, 복도, 가운데 …</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">역할 나누기</text><text x="260" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">자료조사, 발표, 정리</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>