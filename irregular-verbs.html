<meta name="description" content="자주 쓰는 불규칙동사 75개의 과거형·과거분사 표와 검색, 그리고 직접 입력하는 암기 퀴즈. 무료.">
<meta name="keywords" content="불규칙동사 표, 불규칙동사 퀴즈, 과거형 과거분사, 동사 변화표, 영어 동사 암기">

<meta property="og:description" content="불규칙동사 75개 표와 암기 퀴즈, 무료">

<script src="common.js"></script>
<style>
  :root { --paper:#f1eee5; --paper-deep:#e7e2d2; --ink:#201d19; --ink-soft:#56514a; --forest:#2f5d4e; --forest-deep:#22453a; --line:#d9d1bd; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 20px 80px; }
  main { width:100%; max-width:680px; }
  .brand { font-size:15px; color:var(--ink-soft); margin-bottom:24px; } .brand b { color:var(--forest); font-weight:700; }
  h1 { font-size:26px; line-height:1.35; margin:0 0 8px; font-weight:700; letter-spacing:-0.01em; }
  .sub { color:var(--ink-soft); font-size:15px; margin:0 0 22px; line-height:1.6; max-width:50ch; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tab { flex:1; padding:10px; border:1px solid var(--line); border-radius:3px; background:#fffdf8; font-size:14px; color:var(--ink-soft); cursor:pointer; font-family:inherit; }
  .tab.active { background:var(--forest); color:#fffdf8; border-color:var(--forest); }
  .card { background:#fffdf8; border:1px solid var(--line); border-radius:3px; padding:20px 22px; }
  .search { width:100%; padding:11px 14px; font-size:15px; border:1px solid var(--line); border-radius:3px; font-family:inherit; outline:none; margin-bottom:12px; background:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--paper-deep); }
  th { font-size:12px; color:var(--ink-soft); background:var(--paper-deep); font-weight:600; position:sticky; top:0; }
  td.base { font-weight:700; } td.ko { color:var(--ink-soft); }
  td.same { color:#a39a89; }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  select { font-family:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:3px; background:#fff; }
  .btn { background:var(--forest); color:#fffdf8; border:none; border-radius:3px; padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--forest-deep); } .btn:disabled { opacity:.5; cursor:default; }
  .btn-ghost { background:none; border:1px solid var(--line); border-radius:3px; padding:10px 16px; font-size:13px; color:var(--ink-soft); cursor:pointer; font-family:inherit; }
  .btn-ghost:hover { background:var(--paper-deep); color:var(--ink); }
  .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .progress { display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
  .q-base { text-align:center; padding:8px 0 16px; }
  .q-base .w { font-size:34px; font-weight:700; } .q-base .m { font-size:14px; color:var(--ink-soft); margin-top:4px; }
  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .inputs label { font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .inputs input { width:100%; padding:12px; font-size:18px; border:1px solid var(--line); border-radius:3px; font-family:inherit; outline:none; background:#fff; text-align:center; }
  .inputs input:focus { border-color:var(--forest); }
  .inputs input.ok { background:#dcecdf; border-color:#2f5d4e; } .inputs input.bad { background:#f3dcd6; border-color:#a8483a; }
  .feedback { text-align:center; margin-top:12px; font-size:14px; min-height:20px; font-weight:600; }
  .result-head { font-size:24px; font-weight:700; margin:0 0 6px; }
  .result-sub { color:var(--ink-soft); font-size:14px; margin:0 0 18px; }
  .missed { font-size:14px; line-height:1.9; }
  .hidden { display:none; }
  footer { margin-top:56px; font-size:12px; color:#a39a89; text-align:center; line-height:1.8; }
</style>
</head>
<body>

<nav id="site-nav" data-accent="#2f5d4e"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>go·went·gone</b> 불규칙동사</div>
  <h1>불규칙동사, 표로 보고 퀴즈로 굳혀요</h1>
  <p class="sub">자주 쓰는 불규칙동사 75개. 표에서 검색하고, 퀴즈에서 과거형과 과거분사를 직접 입력해 확인하세요.</p>

  <div class="tabs">
    <button class="tab active" data-tab="table">변화표</button>
    <button class="tab" data-tab="quiz">퀴즈</button>
  </div>

  <div id="tablePane" class="card">
    <input class="search" id="search" placeholder="동사나 뜻으로 검색 (예: take, 먹다)">
    <div style="max-height:520px; overflow:auto;">
      <table>
        <thead><tr><th>원형</th><th>과거형</th><th>과거분사</th><th>뜻</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="quizPane" class="card hidden">
    <div id="qSetup">
      <div class="row">
        <label>문제 수 <select id="qCount"><option value="10">10개</option><option value="20">20개</option><option value="75">전체</option></select></label>
        <label>출제 <select id="qMode"><option value="both">과거형 + 과거분사</option><option value="past">과거형만</option><option value="pp">과거분사만</option></select></label>
      </div>
      <button class="btn" id="qStart">퀴즈 시작</button>
    </div>
    <div id="qRun" class="hidden">
      <div class="progress"><span id="qProgress"></span><span id="qScore"></span></div>
      <div class="q-base"><div class="w" id="qWord"></div><div class="m" id="qMeaning"></div></div>
      <div class="inputs">
        <div id="pastWrap"><label>과거형</label><input id="inPast" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div id="ppWrap"><label>과거분사</label><input id="inPp" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="feedback" id="qFeedback"></div>
      <div class="btn-row">
        <button class="btn" id="qCheck">확인 (Enter)</button>
        <button class="btn-ghost hidden" id="qNext">다음 →</button>
        <button class="btn-ghost" id="qQuit">그만하기</button>
      </div>
    </div>
    <div id="qResult" class="hidden">
      <div class="result-head" id="rHead"></div>
      <p class="result-sub" id="rSub"></p>
      <ul class="missed" id="rMissed"></ul>
      <div class="btn-row">
        <button class="btn" id="rRetryMissed">틀린 것만 다시</button>
        <button class="btn-ghost" id="rAgain">처음부터</button>
      </div>
    </div>
  </div>

  <footer>과거형·과거분사에 두 가지 형태가 있는 동사(예: get → got / gotten)는 둘 다 정답으로 인정해요.</footer>
</main>

<script>
  const VERBS = [
    ['be','was/were','been','이다, 있다'],['become','became','become','~이 되다'],['begin','began','begun','시작하다'],['break','broke','broken','부수다'],
    ['bring','brought','brought','가져오다'],['build','built','built','짓다'],['buy','bought','bought','사다'],['catch','caught','caught','잡다'],
    ['choose','chose','chosen','고르다'],['come','came','come','오다'],['cost','cost','cost','비용이 들다'],['cut','cut','cut','자르다'],
    ['do','did','done','하다'],['draw','drew','drawn','그리다'],['drink','drank','drunk','마시다'],['drive','drove','driven','운전하다'],
    ['eat','ate','eaten','먹다'],['fall','fell','fallen','떨어지다'],['feel','felt','felt','느끼다'],['fight','fought','fought','싸우다'],
    ['find','found','found','찾다'],['fly','flew','flown','날다'],['forget','forgot','forgotten/forgot','잊다'],['get','got','gotten/got','얻다'],
    ['give','gave','given','주다'],['go','went','gone','가다'],['grow','grew','grown','자라다'],['have','had','had','가지다'],
    ['hear','heard','heard','듣다'],['hide','hid','hidden','숨기다'],['hit','hit','hit','치다'],['hold','held','held','잡다, 열다'],
    ['hurt','hurt','hurt','다치게 하다'],['keep','kept','kept','유지하다'],['know','knew','known','알다'],['lead','led','led','이끌다'],
    ['leave','left','left','떠나다'],['lend','lent','lent','빌려주다'],['let','let','let','~하게 하다'],['lose','lost','lost','잃다'],
    ['make','made','made','만들다'],['mean','meant','meant','의미하다'],['meet','met','met','만나다'],['pay','paid','paid','지불하다'],
    ['put','put','put','놓다'],['read','read','read','읽다'],['ride','rode','ridden','타다'],['ring','rang','rung','울리다'],
    ['rise','rose','risen','오르다'],['run','ran','run','달리다'],['say','said','said','말하다'],['see','saw','seen','보다'],
    ['sell','sold','sold','팔다'],['send','sent','sent','보내다'],['set','set','set','놓다, 설정하다'],['show','showed','shown/showed','보여주다'],
    ['sing','sang','sung','노래하다'],['sit','sat','sat','앉다'],['sleep','slept','slept','자다'],['speak','spoke','spoken','말하다'],
    ['spend','spent','spent','쓰다, 보내다'],['stand','stood','stood','서다'],['steal','stole','stolen','훔치다'],['swim','swam','swum','수영하다'],
    ['take','took','taken','가져가다'],['teach','taught','taught','가르치다'],['tell','told','told','말하다'],['think','thought','thought','생각하다'],
    ['throw','threw','thrown','던지다'],['understand','understood','understood','이해하다'],['wake','woke','woken','깨다'],['wear','wore','worn','입다'],
    ['win','won','won','이기다'],['write','wrote','written','쓰다']
  ];

  const $ = id => document.getElementById(id);

  // ---- 표 ----
  function renderTable(filter) {
    const f = (filter || '').trim().toLowerCase();
    $('tbody').innerHTML = VERBS.filter(v => !f || v[0].includes(f) || v[1].includes(f) || v[2].includes(f) || v[3].includes(f))
      .map(v => `<tr><td class="base">${v[0]}</td><td class="${v[1]===v[0]?'same':''}">${v[1]}</td><td class="${v[2]===v[0]?'same':''}">${v[2]}</td><td class="ko">${v[3]}</td></tr>`).join('') || '<tr><td colspan="4" style="color:#a39a89">검색 결과가 없어요</td></tr>';
  }
  renderTable();
  $('search').addEventListener('input', e => renderTable(e.target.value));

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
    $('tablePane').classList.toggle('hidden', t.dataset.tab !== 'table');
    $('quizPane').classList.toggle('hidden', t.dataset.tab !== 'quiz');
  }));

  // ---- 퀴즈 ----
  let qList = [], qIdx = 0, qCorrect = 0, qMissed = [], qAnswered = false, qMode = 'both';

  function startQuiz(subset) {
    qMode = $('qMode').value;
    const n = parseInt($('qCount').value, 10);
    qList = subset ? subset.slice() : VERBS.slice().sort(() => Math.random() - 0.5).slice(0, n);
    qIdx = 0; qCorrect = 0; qMissed = [];
    $('qSetup').classList.add('hidden'); $('qResult').classList.add('hidden'); $('qRun').classList.remove('hidden');
    $('pastWrap').style.display = qMode === 'pp' ? 'none' : ''; $('ppWrap').style.display = qMode === 'past' ? 'none' : '';
    showQ();
    if (typeof gtag === 'function') gtag('event', 'irregular_quiz_started', { count: qList.length, mode: qMode });
  }

  function showQ() {
    qAnswered = false;
    const v = qList[qIdx];
    $('qProgress').textContent = `${qIdx + 1} / ${qList.length}`; $('qScore').textContent = `정답 ${qCorrect}`;
    $('qWord').textContent = v[0]; $('qMeaning').textContent = v[3];
    ['inPast','inPp'].forEach(id => { const el = $(id); el.value = ''; el.className = ''; el.disabled = false; });
    $('qFeedback').textContent = '';
    $('qCheck').classList.remove('hidden'); $('qNext').classList.add('hidden');
    (qMode === 'pp' ? $('inPp') : $('inPast')).focus();
  }

  const norm = s => s.toLowerCase().replace(/[^a-z/ ]/g, '').trim();
  const accepts = (answer, typed) => answer.split('/').map(norm).includes(norm(typed)) || norm(answer) === norm(typed);

  function checkQ() {
    if (qAnswered) return;
    qAnswered = true;
    const v = qList[qIdx];
    let ok = true;
    if (qMode !== 'pp') { const r = accepts(v[1], $('inPast').value); $('inPast').classList.add(r ? 'ok' : 'bad'); if (!r) { ok = false; $('inPast').value = v[1]; } }
    if (qMode !== 'past') { const r = accepts(v[2], $('inPp').value); $('inPp').classList.add(r ? 'ok' : 'bad'); if (!r) { ok = false; $('inPp').value = v[2]; } }
    $('inPast').disabled = $('inPp').disabled = true;
    if (ok) { qCorrect++; $('qFeedback').textContent = '정답!'; $('qFeedback').style.color = '#2f5d4e'; }
    else { qMissed.push(v); $('qFeedback').textContent = `${v[0]} – ${v[1]} – ${v[2]}`; $('qFeedback').style.color = '#a8483a'; }
    $('qScore').textContent = `정답 ${qCorrect}`;
    $('qCheck').classList.add('hidden'); $('qNext').classList.remove('hidden'); $('qNext').focus();
  }

  function nextQ() { qIdx++; if (qIdx < qList.length) showQ(); else finishQ(); }

  function finishQ() {
    $('qRun').classList.add('hidden'); $('qResult').classList.remove('hidden');
    $('rHead').textContent = `${qCorrect} / ${qList.length} 정답`;
    $('rSub').textContent = qMissed.length ? '틀린 동사만 다시 풀어보세요.' : '전부 맞혔어요! 🎉';
    $('rMissed').innerHTML = qMissed.map(v => `<li><b>${v[0]}</b> – ${v[1]} – ${v[2]} <span style="color:#a39a89">(${v[3]})</span></li>`).join('');
    $('rRetryMissed').disabled = !qMissed.length;
    if (typeof gtag === 'function') gtag('event', 'irregular_quiz_completed', { count: qList.length, correct: qCorrect });
  }

  $('qStart').addEventListener('click', () => startQuiz());
  $('qCheck').addEventListener('click', checkQ);
  $('qNext').addEventListener('click', nextQ);
  $('qQuit').addEventListener('click', () => { $('qRun').classList.add('hidden'); $('qSetup').classList.remove('hidden'); });
  $('rRetryMissed').addEventListener('click', () => startQuiz(qMissed));
  $('rAgain').addEventListener('click', () => startQuiz());
  ['inPast','inPp'].forEach(id => $(id).addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (qAnswered) return nextQ();
    if (id === 'inPast' && qMode === 'both' && !$('inPp').value) return $('inPp').focus();
    checkQ();
  }));
</script>

</body>
</html>
