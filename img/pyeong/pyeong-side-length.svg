<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img"><title>평수를 정사각형 한 변 길이로 보면</title><desc>1평은 한 변 약 1.82m, 10평 약 5.75m, 34평 약 10.6m 정사각형</desc><rect width="800" height="574" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">평수를 정사각형 한 변 길이로 보면</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">한 변 = √㎡</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">평</text><text x="230" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">㎡</text><text x="440" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">정사각형 한 변</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1평</text><text x="230" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3.31㎡</text><text x="440" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 1.82m (181.8cm)</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">10평</text><text x="230" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">33.06㎡</text><text x="440" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 5.75m (575cm)</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">13.5평</text><text x="230" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">44.63㎡</text><text x="440" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 6.68m (668cm)</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">18평</text><text x="230" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">59.5㎡</text><text x="440" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 7.71m (771.4cm)</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">25평</text><text x="230" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">82.64㎡</text><text x="440" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 9.09m (909.1cm)</text><rect x="40" y="416" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="448" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">34평</text><text x="230" y="448" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">112.4㎡</text><text x="440" y="448" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 10.6m (1060.2cm)</text><text x="40" y="500" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">넓이가 같아도 모양에 따라 가로·세로는 달라져요.</text><text x="40" y="544" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>