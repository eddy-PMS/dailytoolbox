<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" role="img"><title>글자 수에 맞는 도장 배치</title><desc>2~3자는 세로 한 줄, 4자는 한글 가로 두 줄·한자 세로 두 줄, 5~9자는 석 줄, 표시용 문구는 가로 한 줄, 법인 도장은 둘레 글자와 가운데 글자</desc><rect width="800" height="506" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23">글자 수에 맞는 도장 배치</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff">글자 수</text><text x="200" y="117" font-size="18" font-weight="700" fill="#ffffff">어울리는 배치</text><text x="470" y="117" font-size="18" font-weight="700" fill="#ffffff">비고</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23">2~3자</text><text x="200" y="164" font-size="18" fill="#151a23">세로 한 줄</text><text x="470" y="164" font-size="18" fill="#1e47a8">이름 도장에 흔한 모양</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23">4자 (한글)</text><text x="200" y="214" font-size="18" fill="#151a23">가로 두 줄</text><text x="470" y="214" font-size="18" fill="#1e47a8">왼쪽부터 “가나 / 다라”</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23">4자 (한자)</text><text x="200" y="264" font-size="18" fill="#151a23">세로 두 줄</text><text x="470" y="264" font-size="18" fill="#1e47a8">오른쪽 줄부터 읽는 전통 배치</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23">5~9자</text><text x="200" y="314" font-size="18" fill="#151a23">석 줄 (9자는 3×3)</text><text x="470" y="314" font-size="18" fill="#1e47a8">글자가 작아지니 크기 확인</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23">표시용 문구</text><text x="200" y="364" font-size="18" fill="#151a23">가로 한 줄</text><text x="470" y="364" font-size="18" fill="#1e47a8">“확인”, “검토필” 등</text><rect x="40" y="382" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3"/><text x="58" y="414" font-size="18" font-weight="700" fill="#151a23">법인 도장</text><text x="200" y="414" font-size="18" fill="#151a23">둘레 글자 + 가운데</text><text x="470" y="414" font-size="18" fill="#1e47a8">둘레 회사 이름, 가운데 “대표이사”</text><text x="40" y="476" font-size="15" fill="#5b6472">dailyfreetoolbox.com</text></g></svg>
