<meta name="description" content="대출 원금·금리·기간을 입력하면 상환 방식별 월 납입금과 총 이자를 비교하고 상환 스케줄을 보여주는 무료 계산기.">
<meta name="keywords" content="대출 이자 계산기, 원리금균등 계산, 원금균등 계산, 대출 상환 계산기, 월 상환금 계산, 총 이자">

{"@context": "https://schema.org", "@type": "WebApplication", "name": "대출 이자 계산기", "url": "https://dailyfreetoolbox.com/loan.html", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW"}, "description": "대출 원금·금리·기간을 입력하면 상환 방식별 월 납입금과 총 이자를 비교하고 상환 스케줄을 보여주는 무료 계산기."}

<script src="common.js"></script>

</head>
<body>

<nav id="site-nav" data-accent="#2d5f5f"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>₩ 대출 이자 계산기</b></div>
  <h1>상환 방식에 따라 이자가 얼마나 달라질까요</h1>
  <p class="sub">원리금균등·원금균등·만기일시 세 방식을 한 번에 비교하고, 월별 상환 스케줄까지 확인할 수 있어요.</p>

  <div class="card">
    <div class="grid2">
      <div class="field"><label>대출 원금</label><div class="unit"><input type="number" id="p" value="100000000" step="1000000" min="0"><span>원</span></div></div>
      <div class="field"><label>연 이자율</label><div class="unit"><input type="number" id="r" value="4.5" step="0.1" min="0"><span>%</span></div></div>
      <div class="field"><label>대출 기간</label><div class="unit"><input type="number" id="n" value="30" min="1" max="50"><span>년</span></div></div>
      <div class="field"><label>거치 기간 (이자만 납부)</label><div class="unit"><input type="number" id="g" value="0" min="0" max="10"><span>년</span></div></div>
    </div>
    <div class="btn-row"><button class="btn" id="calc">계산하기</button></div>
  </div>
  <div class="card" id="cmp"></div>
  <div class="card" id="sched"></div>
 
  <footer>월 복리 기준 계산이며 중도상환수수료, 변동금리, 취급수수료는 반영하지 않습니다. 실제 조건은 금융기관 안내를 확인하세요.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function schedule(P, rate, months, grace, type){
  const i=rate/12, rows=[]; let bal=P, totalInt=0;
  const amortMonths=months-grace;
  const pmt= i>0? P*i*Math.pow(1+i,amortMonths)/(Math.pow(1+i,amortMonths)-1) : P/amortMonths;
  for(let m=1;m<=months;m++){
    let interest=bal*i, principal=0;
    if(m<=grace){ principal=0; }
    else if(type==='equalPay'){ principal=pmt-interest; }
    else if(type==='equalPrin'){ principal=P/amortMonths; }
    else { principal= m===months? bal : 0; }
    if(m===months) principal=bal;
    bal-=principal; totalInt+=interest;
    rows.push({m, pay:principal+interest, principal, interest, bal:Math.max(0,bal)});
  }
  return {rows,totalInt};
}
let last=null;
function calc(){
  const P=+$('p').value||0, rate=(+$('r').value||0)/100, years=+$('n').value||1, g=Math.min(+$('g').value||0, years-1);
  const months=years*12, grace=g*12;
  const types=[['equalPay','원리금균등'],['equalPrin','원금균등'],['bullet','만기일시']];
  last=types.map(([t,name])=>{const s=schedule(P,rate,months,grace,t); return {t,name,s};});
  $('cmp').innerHTML=`<h2>상환 방식 비교</h2><table><thead><tr><th>방식</th><th class="r">첫 달 납입</th><th class="r">마지막 달</th><th class="r">총 이자</th><th class="r">총 상환액</th></tr></thead><tbody>`+
    last.map(x=>`<tr><td>${x.name}</td><td class="r">${won(x.s.rows[grace].pay)}</td><td class="r">${won(x.s.rows[months-1].pay)}</td><td class="r">${won(x.s.totalInt)}</td><td class="r">${won(P+x.s.totalInt)}</td></tr>`).join('')+
    `</tbody></table><div class="note">원리금균등은 매달 같은 금액, 원금균등은 초반 부담이 크지만 총 이자가 가장 적고, 만기일시는 매달 이자만 내다 만기에 원금을 한 번에 갚아요.${grace?` 거치 ${g}년 동안은 이자만 납부합니다.`:''}</div>`;
  renderSched('equalPay');
  if(typeof gtag==='function') gtag('event','loan_calculated',{P, years});
}
function renderSched(t, all){
  const x=last.find(v=>v.t===t); const rows=all? x.s.rows : x.s.rows.slice(0,12);
  $('sched').innerHTML=`<h2>월별 상환 스케줄 · <select id="schType" style="width:auto;padding:4px 8px;font-size:13px">${last.map(v=>`<option value="${v.t}" ${v.t===t?'selected':''}>${v.name}</option>`).join('')}</select></h2>
    <div style="max-height:420px;overflow:auto"><table><thead><tr><th>회차</th><th class="r">납입금</th><th class="r">원금</th><th class="r">이자</th><th class="r">잔액</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${r.m}</td><td class="r">${won(r.pay)}</td><td class="r">${won(r.principal)}</td><td class="r">${won(r.interest)}</td><td class="r">${won(r.bal)}</td></tr>`).join('')+
    `</tbody></table></div>`+(all?'':`<div class="btn-row"><button class="btn-ghost" id="showAll">전체 ${x.s.rows.length}개월 보기</button></div>`);
  $('schType').addEventListener('change',e=>renderSched(e.target.value, all));
  const b=$('showAll'); if(b) b.addEventListener('click',()=>renderSched(t,true));
}
$('calc').addEventListener('click',calc); calc();
 
</script>

</body>
</html>
