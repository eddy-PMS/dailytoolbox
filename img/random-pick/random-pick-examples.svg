<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>랜덤 뽑기, 이런 항목을 넣어보세요</title><desc>점심 메뉴, 주말 활동, 발표 순서, 경품 추첨에 쓰는 예시</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">랜덤 뽑기, 이런 항목을 넣어보세요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">상황</text><text x="250" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">예시 항목</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">점심 메뉴</text><text x="250" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">김치찌개, 돈까스, 초밥, 파스타, 쌀국수</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">주말 활동</text><text x="250" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">영화, 등산, 카페, 집에서 쉬기</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">발표 순서</text><text x="250" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">조 이름 넣고 '전체 순서 섞기'</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">경품 추첨</text><text x="250" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">참가자 이름 넣고 뽑을 개수 = 경품 수</text><text x="40" y="376" font-size="15" font-weight="400" fill="#