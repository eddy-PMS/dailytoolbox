<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="naver-site-verification" content="852adc0d7cb49c870de02857b2624318467fe862" />
<title>팀 나누기 - 이름 넣고 랜덤으로 팀 짜기 (내전, 조 편성)</title>
<meta name="description" content="이름을 입력하고 팀 수를 정하면 무작위로 팀을 나눠주는 무료 도구. 롤 내전, 조별 과제, 체육대회 조 편성에.">
<meta name="keywords" content="팀 나누기, 랜덤 팀 짜기, 조 편성, 내전 팀 나누기, 팀 짜기 사이트, 조 나누기">
<link rel="canonical" href="https://dailyfreetoolbox.com/team.html">
<meta property="og:type" content="website">
<meta property="og:title" content="팀 나누기">
<meta property="og:description" content="이름을 입력하고 팀 수를 정하면 무작위로 팀을 나눠주는 무료 도구. 롤 내전, 조별 과제, 체육대회 조 편성에.">
<meta property="og:url" content="https://dailyfreetoolbox.com/team.html">
<meta property="og:locale" content="ko_KR">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebApplication", "name": "팀 나누기", "url": "https://dailyfreetoolbox.com/team.html", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW"}, "description": "이름을 입력하고 팀 수를 정하면 무작위로 팀을 나눠주는 무료 도구. 롤 내전, 조별 과제, 체육대회 조 편성에."}
</script>
<script src="common.js"></script>
<link rel="stylesheet" href="tool.css">
<style>:root { --accent:#3b6d8a; --accent-deep:#2a5168; }</style>

</head>
<body>

<nav id="site-nav" data-accent="#3b6d8a"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>👥 팀 나누기</b></div>
  <h1>공평하게, 랜덤으로 팀 짜기</h1>
  <p class="sub">이름을 넣고 팀 수(또는 팀당 인원)를 정하면 무작위로 나눠드려요. 마음에 안 들면 다시 섞으세요.</p>

  <div class="card">
    <div class="field"><label>이름 (줄바꿈 또는 쉼표)</label><textarea id="names" style="min-height:110px">민수, 지훈, 서연, 하늘, 준호, 유진, 도윤, 수아, 시우, 예린</textarea></div>
    <div class="row" style="margin-top:12px"><label>나누기 <select id="mode" style="width:auto;padding:5px 8px;font-size:13px"><option value="teams">팀 수로</option><option value="size">팀당 인원으로</option></select></label><label><input class="inline" type="number" id="n" value="2" min="1" style="width:70px"></label></div>
    <div class="btn-row"><button class="btn" id="go">팀 나누기</button><button class="btn-ghost" id="copy">결과 복사</button></div>
  </div>
  <div id="out"></div>
 
  <footer>완전 무작위로 나누며, 실력 균형은 고려하지 않아요.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
const parse=s=>s.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
let last=[];
function go(){
  const names=parse($('names').value); if(names.length<2){ $('out').innerHTML='<div class="empty">이름을 2명 이상 입력하세요</div>'; return; }
  const n=Math.max(1,+$('n').value||1); const teams= $('mode').value==='teams'? n : Math.ceil(names.length/n);
  const arr=names.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  last=Array.from({length:teams},()=>[]); arr.forEach((nm,i)=>last[i%teams].push(nm));
  $('out').innerHTML=`<div class="stat-grid">${last.map((t,i)=>`<div class="stat" style="text-align:left"><div class="label" style="margin-bottom:6px">팀 ${i+1} · ${t.length}명</div>${t.map(x=>`<div style="font-size:15px;padding:2px 0">${x}</div>`).join('')}</div>`).join('')}</div>`;
  if(typeof gtag==='function') gtag('event','team_divided',{people:names.length,teams});
}
$('go').addEventListener('click',go);
$('copy').addEventListener('click',async()=>{ if(!last.length) return; const t=last.map((x,i)=>`팀 ${i+1}: ${x.join(', ')}`).join('\n'); try{ await navigator.clipboard.writeText(t); $('copy').textContent='복사됨'; setTimeout(()=>$('copy').textContent='결과 복사',1500);}catch{} });
go();
 
</script>

</body>
</html>
