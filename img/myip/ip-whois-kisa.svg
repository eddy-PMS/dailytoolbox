<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>IP가 어느 기관 것인지 공식으로 확인</title><desc>KISA 후이즈(whois.kr)에서 IP·AS 번호를 넣으면 할당 기관을 확인할 수 있다</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">IP가 어느 기관 것인지 공식으로 확인</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">한국인터넷진흥원(KISA) 후이즈</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">whois.kr 에서 IP 주소나 AS 번호 입력</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">할당 기관 확인</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">국내·해외 IP, AS 번호, 도메인도 조회</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">개인 가입자는 안 나와요</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">할당받은 기관까지만 보여 줘요</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>