<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>서명 이미지와 전자서명은 달라요</title><desc>서명 이미지는 그림 파일이라 서명자 확인·위변조 확인이 안 되고, 인증서 기반 전자서명은 된다</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">서명 이미지와 전자서명은 달라요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구분</text><text x="190" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">서명 이미지(이 도구)</text><text x="450" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">인증서 기반 전자서명</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">본질</text><text x="190" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">그림 파일(PNG)</text><text x="450" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전자적으로 서명한 기록</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">서명자 확인</text><text x="190" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">안 됨</text><text x="450" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">인증 수단으로 확인</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">위변조 확인</text><text x="190" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">안 됨</text><text x="450" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">문서가 바뀌었는지 검증</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">복사</text><text x="190" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">복사하면 그대로 쓸 수 있음</text><text x="450" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">복사해도 효력이 안 옮겨짐</text><text x="40" y="366" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">법적 다툼이 생길 수 있는 계약에는 서명 이미지를 쓰지 마세요.</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>