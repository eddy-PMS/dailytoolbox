<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>썸네일 제목 글자, 잘 보이게</title><desc>외곽선 6~12, 그림자 흐림 16~24, 배경 어둡게 30~50%, 자간 -2~2, 행간 1.2~1.4</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">썸네일 제목 글자, 잘 보이게</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">문제</text><text x="400" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">설정</text><text x="600" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">값</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">배경 사진에 글자가 묻힌다</text><text x="400" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">외곽선 두께</text><text x="600" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">6~12</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">외곽선만으로 부족하다</text><text x="400" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">그림자 흐림</text><text x="600" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">16~24</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">사진이 밝고 어수선하다</text><text x="400" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">배경 어둡게</text><text x="600" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">30~50%</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">글자가 답답해 보인다</text><text x="400" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">자간</text><text x="600" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">-2~2</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">두 줄이 붙어 보인다</text><text x="400" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">행간</text><text x="600" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1.2~1.4</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">가장 확실한 조합은 흰 글자 + 검은 외곽선. 제목은 한 줄 7~10자, 두 줄까지.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>