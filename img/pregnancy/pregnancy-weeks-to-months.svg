<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img"><title>임신 주수와 개월수</title><desc>4주를 1개월로 봐서 12주는 3개월, 28주는 7개월, 40주는 10개월</desc><rect width="800" height="380" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">임신 주수와 개월수</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">보통 4주를 1개월로 봐요</text><rect x="40.0" y="120" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="155.33333333333331" y="152" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">12주</text><text x="155.33333333333331" y="196" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">3개월</text><text x="155.33333333333331" y="228" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle"></text><rect x="284.7" y="120" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="399.99999999999994" y="152" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">28주</text><text x="399.99999999999994" y="196" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">7개월</text><text x="399.99999999999994" y="228" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle"></text><rect x="529.3" y="120" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="644.6666666666666" y="152" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">40주</text><text x="644.6666666666666" y="196" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">10개월</text><text x="644.6666666666666" y="228" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">만삭</text><text x="40" y="280" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">예정일 당일에 태어나는 아기는 약 5%예요.</text><text x="40" y="306" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">대부분 예정일 앞뒤 2주(37~42주) 안에 출산합니다.</text><text x="40" y="350" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>