<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>목표별 칼로리와 단백질</title><desc>다이어트는 유지 칼로리 × 0.8에 단백질 체중 1kg당 2.0g</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">목표별 칼로리와 단백질</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">목표</text><text x="220" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">칼로리</text><text x="560" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">단백질 (체중 1kg당)</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">다이어트</text><text x="220" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">유지 칼로리 × 0.8 (−20%)</text><text x="560" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2.0g</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">유지</text><text x="220" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">유지 칼로리 그대로</text><text x="560" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1.6g</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">린매스업</text><text x="220" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">유지 칼로리 × 1.1 (+10%)</text><text x="560" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1.8g</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">벌크업</text><text x="220" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">유지 칼로리 × 1.2 (+20%)</text><text x="560" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1.8g</text><text x="40" y="366" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">지방은 체중 1kg당 0.9g, 남는 칼로리를 탄수화물로 채워요.</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>