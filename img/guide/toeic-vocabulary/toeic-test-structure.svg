<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img"><title>토익 시험 구성</title><desc>토익은 듣기 45분 100문항, 읽기 75분 100문항, 합계 200문항 120분</desc><rect width="800" height="640" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">토익 시험 구성</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">듣기 · 읽기 각 5~495점(5점 단위), 합계 10~990점</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">섹션</text><text x="190" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">파트</text><text x="310" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">유형</text><text x="600" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">문항 수</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">듣기 45분</text><text x="190" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">Part 1</text><text x="310" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">사진 묘사</text><text x="600" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">6</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start"></text><text x="190" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">Part 2</text><text x="310" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">질의응답</text><text x="600" y="248" font-size="18" font-weight="400" fill="#1e