<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>어떤 사진에 잘 되나요</title><desc>흰 배경 상품 사진·로고·서명 도장 스캔은 잘 되고, 풍경 배경은 어렵다</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">어떤 사진에 잘 되나요</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">지울 색을 정해 비슷한 색을 투명하게 — AI 자동 누끼가 아니에요</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">사진</text><text x="300" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">결과</text><text x="440" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">요령</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">흰 배경 상품 사진</text><text x="300" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">잘 됨</text><text x="440" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">허용 범위 30~60</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">로고·아이콘(흰 바탕)</text><text x="300" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">잘 됨</text><text x="440" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">가장자리 부드럽게 5~15</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">서명·도장 스캔</text><text x="300" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">잘 됨</text><text x="440" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">허용 범위를 올려 누런기 제거</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">흰 벽 앞 인물·증명사진</text><text x="300" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대체로 됨</text><text x="440" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">머리카락 경계는 완벽하지 않음</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">야외·실내 풍경 배경</text><text x="300" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">어려움</text><text x="440" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">배경 색이 여러 가지라 한계</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>