<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img"><title>IP로 알 수 있는 것과 없는 것</title><desc>IP로는 국가·도시 단위 지역과 통신사를 알 수 있고, 정확한 주소·동호수·이름은 알 수 없다</desc><rect width="800" height="356" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">IP로 알 수 있는 것과 없는 것</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">알 수 있음</text><text x="430" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">알 수 없음</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">국가, 대략적인 지역(도시 단위)</text><text x="430" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">정확한 주소, 동·호수</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">통신사(ISP)와 회선 종류</text><text x="430" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">이름, 전화번호 등 개인정보</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">IP 종류(가정용·기업·데이터센터·VPN)</text><text x="430" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">기기 종류나 쓰는 사람 수</text><text x="40" y="326" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>