<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 664" role="img"><title>주휴수당 미지급, 신고 순서</title><desc>금액 정리, 증거 모으기, 사업주에게 요청, 진정 접수, 조사와 지급 지시</desc><rect width="800" height="664" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">주휴수당 미지급, 신고 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">금액 정리</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">주별 근무시간과 개근 여부로 못 받은 금액 계산</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">증거 모으기</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로계약서, 근무표, 출퇴근 기록, 급여 명세서</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">사업주에게 요청</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">문자·메신저처럼 기록이 남는 방법으로</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">진정 접수</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">고용노동부 노동포털 또는 관할 고용노동관서</text><rect x="40" y="502" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="536" r="20" fill="#2b5fd9"/><text x="80" y="543" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="542" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">조사와 지급 지시</text><text x="118" y="574" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로감독관이 체불액을 확정하고 지급을 지시</text><text x="40" y="634" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>