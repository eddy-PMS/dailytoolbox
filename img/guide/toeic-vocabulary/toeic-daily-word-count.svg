<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img"><title>토익 단어 하루 분량 계산</title><desc>1,200개를 60일에 외우려면 하루 새 단어 약 29개, 복습 약 90~120개</desc><rect width="800" height="484" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">토익 단어 하루 분량 계산</text><rect x="40" y="86" width="720" height="106" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">하루 새 단어 = 총개수 ÷ (남은 날수 × 0.7)</text><text x="66" y="176" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">예) 1,200 ÷ (60 × 0.7) ≈ 29개</text><rect x="40" y="216" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">항목</text><text x="200" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산</text><text x="470" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">예</text><rect x="40" y="260" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="292" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">하루 새 단어</text><text x="200" y="292" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">총개수 ÷ (남은 날수 × 0.7)</text><text x="470" y="292" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1,200 ÷ (60 × 0.7) ≈ 29개</text><rect x="40" y="310" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="342" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">하루 복습</text><text x="200" y="342" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">새 단어의 3~4배</text><text x="470" y="342" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 90~120개</text><rect x="40" y="360" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="392" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">남겨 둔 날</text><text x="200" y="392" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">남은 날수 × 0.3</text><text x="470" y="392" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">18일 — 복습과 모의 전용</text><text x="40" y="454" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>