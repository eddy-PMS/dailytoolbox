<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 354" role="img"><title>오류 정정 수준 (L · M · Q · H)</title><desc>오류 정정 수준은 일반 용도 M, 훼손 우려가 있으면 Q나 H</desc><rect width="800" height="354" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">오류 정정 수준 (L · M · Q · H)</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">QR이 일부 훼손돼도 읽히는 정도</text><rect x="40.0" y="120" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="152" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">일반 용도</text><text x="216.5" y="196" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">M</text><text x="216.5" y="228" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle"></text><rect x="407.0" y="120" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="152" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">스티커 · 현수막</text><text x="583.5" y="196" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">Q · H</text><text x="583.5" y="228" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">훼손 우려가 있을 때</text><text x="40" y="280" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">높을수록 패턴이 촘촘해지지만 인쇄 상태가 나빠도 잘 읽혀요.</text><text x="40" y="324" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>