<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>휴대폰 IP, 와이파이와 데이터에서 달라요</title><desc>와이파이는 공유기 회선의 공인 IP, 모바일 데이터는 통신사 게이트웨이 IP</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">휴대폰 IP, 와이파이와 데이터에서 달라요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"></text><text x="200" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">와이파이</text><text x="470" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">모바일 데이터</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">보이는 IP</text><text x="200" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">공유기 회선의 공인 IP</text><text x="470" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">통신사 게이트웨이 IP</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">위치</text><text x="200" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">회선이 등록된 지역</text><text x="470" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">게이트웨이 위치(서울 많음)</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">집 PC와 비교</text><text x="200" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">같은 공유기면 같은 IP</text><text x="470" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">PC와 전혀 다른 IP</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">IPv6</text><text x="200" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">회선에 따라 다름</text><text x="470" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">우선 잡히는 경우가 많음</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>