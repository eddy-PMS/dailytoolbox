<body>

<nav id="site-nav" data-accent="#3a3f4a"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>🔐 비밀번호 생성기</b></div>
  <h1>외우기 어려운 게 좋은 비밀번호예요</h1>
  <p class="sub">브라우저의 암호학적 난수로 비밀번호를 만들어요. 서버에 전송되지 않으니 안심하고 쓰고, 사이트마다 다른 비밀번호를 비밀번호 관리자에 저장하세요.</p>

  <div class="card">
    <div class="row"><label>길이 <input type="range" id="len" min="8" max="64" value="16"> <b id="lenv">16</b></label></div>
    <div class="row"><label><input type="checkbox" id="lower" checked> 소문자</label><label><input type="checkbox" id="upper" checked> 대문자</label><label><input type="checkbox" id="digit" checked> 숫자</label><label><input type="checkbox" id="sym" checked> 특수문자</label><label><input type="checkbox" id="noamb" checked> 헷갈리는 문자 제외 (0O1lI)</label></div>
    <div class="btn-row"><button class="btn" id="go">생성</button><button class="btn-ghost" id="copy">복사</button></div>
    <div id="pw" style="margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;word-break:break-all;background:var(--paper);padding:14px;border-radius:3px;border:1px solid var(--line);min-height:52px"></div>
    <div class="note" id="strength"></div>
    <div id="more" class="note" style="font-family:ui-monospace,Menlo,Consolas,monospace"></div>
  </div>
 
  <footer>생성된 비밀번호는 화면에만 표시되고 저장되지 않아요. 중요한 계정엔 2단계 인증도 함께 켜두세요.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
$('len').addEventListener('input',()=>$('lenv').textContent=$('len').value);
function charset(){ let s=''; const amb=$('noamb').checked; if($('lower').checked) s+= amb?'abcdefghijkmnopqrstuvwxyz':'abcdefghijklmnopqrstuvwxyz'; if($('upper').checked) s+= amb?'ABCDEFGHJKLMNPQRSTUVWXYZ':'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; if($('digit').checked) s+= amb?'23456789':'0123456789'; if($('sym').checked) s+='!@#$%^&*()-_=+[]{};:,.?'; return s; }
function one(len){ const cs=charset(); if(!cs) return ''; const a=new Uint32Array(len); crypto.getRandomValues(a); return [...a].map(x=>cs[x%cs.length]).join(''); }
function gen(){ const len=+$('len').value; const cs=charset(); if(!cs){ $('pw').textContent='문자 종류를 하나 이상 선택하세요'; return; } const p=one(len); $('pw').textContent=p; const bits=Math.round(len*Math.log2(cs.length)); $('strength').innerHTML=`엔트로피 약 ${bits}비트 · <b class="${bits>=80?'ok':bits>=60?'':'bad'}">${bits>=100?'매우 강함':bits>=80?'강함':bits>=60?'보통':'약함'}</b> · 문자 집합 ${cs.length}종`; $('more').innerHTML='다른 후보<br>'+[0,1,2].map(()=>one(len)).join('<br>'); if(typeof gtag==='function') gtag('event','password_generated',{len}); }
$('go').addEventListener('click',gen); ['lower','upper','digit','sym','noamb','len'].forEach(id=>$(id).addEventListener('input',gen));
$('copy').addEventListener('click',async()=>{ const p=$('pw').textContent; if(!p) return; try{ await navigator.clipboard.writeText(p); $('copy').textContent='복사됨'; setTimeout(()=>$('copy').textContent='복사',1500);}catch{} });
gen();
 
</script>

</body>
