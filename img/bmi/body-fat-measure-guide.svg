<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img"><title>체지방률 계산, 둘레 재는 위치</title><desc>허리는 배꼽 높이, 목은 후두 바로 아래, 엉덩이는 가장 튀어나온 부분을 줄자를 수평으로 대고 잰다</desc><rect width="800" height="640" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">체지방률 계산, 둘레 재는 위치</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">줄자를 수평으로 대고 재세요</text><rect x="40" y="120" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="154" r="20" fill="#2b5fd9"/><text x="80" y="161" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="160" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">허리</text><text x="118" y="192" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">배꼽 높이에서 숨을 내쉰 상태로</text><rect x="40" y="224" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="258" r="20" fill="#2b5fd9"/><text x="80" y="265" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="264" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">목</text><text x="118" y="296" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">후두 바로 아래</text><rect x="40" y="328" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="362" r="20" fill="#2b5fd9"/><text x="80" y="369" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="368" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">엉덩이 (여성)</text><text x="118" y="400" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">가장 튀어나온 부분</text><rect x="40.0" y="440" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="472" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">남성 건강 범위</text><text x="216.5" y="516" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">15~20%</text><text x="216.5" y="548" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">25% 넘으면 비만</text><rect x="407.0" y="440" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="472" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">여성 건강 범위</text><text x="583.5" y="516" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">20~28%</text><text x="583.5" y="548" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">32% 넘으면 비만</text><text x="40" y="610" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>