<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>내 IP가 바뀌는 이유 — 유동 IP</title><desc>가정용 공인 IP는 대부분 유동 IP라 공유기를 껐다 켜거나 며칠 지나면 바뀐다</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">내 IP가 바뀌는 이유 — 유동 IP</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">통신사가 주기적으로 바꿔요</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">공유기를 껐다 켜거나 며칠 지나면 달라질 수 있어요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고정돼야 하는 일에는 주의</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">서버 화이트리스트·원격 접속 — 고정 IP 상품 신청</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">일부러 바꾸려면</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">공유기를 껐다가 10분쯤 뒤에 켜기, 또는 VPN</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>