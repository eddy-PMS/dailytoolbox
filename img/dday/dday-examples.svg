<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>자주 쓰는 D-day 세는 방법</title><desc>시험, 연인 100일, 아기 백일, 전역·퇴사 디데이 세는 방법</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">자주 쓰는 D-day 세는 방법</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">용도</text><text x="300" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">세는 방법</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">수능·토익 등 시험</text><text x="300" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">오늘 제외, 시험 당일 D-Day</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">연인 100일·1000일</text><text x="300" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">사귄 날 = 1일, 100일째는 99일 뒤</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">아기 백일</text><text x="300" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">태어난 날 = 1일, 100일째는 99일 뒤</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">전역·퇴사·계약 만료</text><text x="300" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">해당일 D-Day, 남은 일수는 오늘 제외</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>