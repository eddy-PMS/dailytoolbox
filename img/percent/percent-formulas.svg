<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>퍼센트 계산 공식 4가지</title><desc>A는 B의 몇 %, A의 N%, 증감률, N% 더하기·빼기 공식과 예시</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">퍼센트 계산 공식 4가지</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산</text><text x="250" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">공식</text><text x="490" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">예시</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">A는 B의 몇 %</text><text x="250" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">A ÷ B × 100</text><text x="490" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">30은 200의 15%</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">A의 N%는 얼마</text><text x="250" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">A × N ÷ 100</text><text x="490" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">5만원의 15% = 7,500원</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">증감률</text><text x="250" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">(B − A) ÷ A × 100</text><text x="490" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4만원 → 4.6만원 = +15%</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N% 더하기·빼기</text><text x="250" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">A × (1 ± N÷100)</text><text x="490" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">12만원 + 10% = 13.2만원</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>