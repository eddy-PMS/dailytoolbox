<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img"><title>사진 용량을 정하는 세 가지</title><desc>해상도, 형식, 압축 품질이 사진 용량을 정한다</desc><rect width="800" height="540" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">사진 용량을 정하는 세 가지</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">해상도</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">가로×세로 픽셀 수</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">픽셀 수에 거의 비례해 커져요</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">형식</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">JPG, PNG, WEBP 등 저장 방식</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">같은 사진도 형식에 따라 몇 배 차이</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">압축 품질</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">JPG·WEBP에서 얼마나 세게 누르는지</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">품질을 낮출수록 작아져요</text><text x="40" y="510" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>