<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" role="img"><title>근무 형태별 주휴수당 예시</title><desc>평일 5일 × 4시간은 41,280원, 주말 2일 × 8시간은 33,024원</desc><rect width="800" height="506" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">근무 형태별 주휴수당 예시</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">근무 형태</text><text x="340" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">주 근무</text><text x="450" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산</text><text x="660" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">주휴수당</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">평일 5일 × 4시간</text><text x="340" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">20시간</text><text x="450" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">20 ÷ 40 × 8 = 4시간</text><text x="660" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">41,280원</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">주 3일 × 5시간</text><text x="340" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15시간</text><text x="450" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15 ÷ 40 × 8 = 3시간</text><text x="660" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">30,960원</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">주말 2일 × 8시간</text><text x="340" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">16시간</text><text x="450" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">16 ÷ 40 × 8 = 3.2시간</text><text x="660" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">33,024원</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">주 2일 × 7시간</text><text x="340" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">14시간</text><text x="450" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15시간 미만</text><text x="660" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">없음</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">주 5일 × 8시간</text><text x="340" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">40시간</text><text x="450" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">8시간</text><text x="660" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">82,560원</text><rect x="40" y="382" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="414" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">시급 12,000원, 주 4일 × 6시간</text><text x="340" y="414" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">24시간</text><text x="450" y="414" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">24 ÷ 40 × 8 = 4.8시간</text><text x="660" y="414" font-size="18" font-weight="400" fill="#1e47a8" t