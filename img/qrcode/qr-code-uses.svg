<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>QR코드로 만들 수 있는 것</title><desc>QR코드에는 URL, 텍스트, 와이파이 접속 정보를 담을 수 있다</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">QR코드로 만들 수 있는 것</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">URL</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">카메라로 찍으면 링크가 바로 열려요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">와이파이</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">비밀번호 입력 없이 접속돼요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">텍스트</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">일반 문자열도 그대로 담을 수 있어요</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">브라우저 안에서 만들고 PNG로 저장해요.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>