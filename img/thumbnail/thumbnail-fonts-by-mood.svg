<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 706" role="img"><title>썸네일 폰트, 분위기별로</title><desc>고딕·명조·굵은 제목·손글씨 글꼴과 어울리는 곳</desc><rect width="800" height="706" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">썸네일 폰트, 분위기별로</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고딕</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">본고딕, 고딕 A1, 나눔고딕, 고운돋움, IBM Plex Sans KR</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">정보·리뷰처럼 또박또박 읽혀야 할 때</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">명조</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">본명조, 나눔명조, 송명, 고운바탕</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">차분한 분위기, 글·책 관련</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">굵은 제목</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">검은고딕, 주아, 도현, 가석, 베이글팻</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">작게 보여도 눈에 띄어야 할 때</text><rect x="40" y="482" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="516" r="20" fill="#2b5fd9"/><text x="80" y="523" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="522" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">손글씨</text><text x="118" y="554" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">개구, 나눔손글씨 펜·붓, 동글, 하이멜로디</text><text x="118" y="582" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">가볍고 친근한 분위기</text><text x="40" y="632" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">모두 구글 폰트의 오픈 폰트 라이선스(OFL) 글꼴이에요.</text><text x="40" y="676" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>