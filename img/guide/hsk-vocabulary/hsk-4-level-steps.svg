<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>HSK 4급까지 4단계</title><desc>1급 150, 2급 +150, 3급 +300, 4급 +600</desc><rect width="800" height="560" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">HSK 4급까지 4단계</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">1급 — 150</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">성조 네 개를 소리로 구분하는 것이 먼저</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">2급 — +150</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1급 단어를 문장으로 다시 만나기</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">3급 — +300</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">듣기 비중이 커져요. 소리 복습 시작</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">4급 — +600</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">뜻이 여러 개인 단어, 비슷한 뜻 구분</text><text x="40" y="530" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>