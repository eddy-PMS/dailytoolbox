<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" role="img"><title>배란일 계산법</title><desc>배란 예상일은 다음 생리 예정일에서 14일을 뺀 날. 28일 주기면 생리 시작일 + 14일</desc><rect width="800" height="534" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">배란일 계산법</text><rect x="40" y="86" width="720" height="106" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">배란 예상일 = 다음 생리 예정일 − 14일</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">다음 생리 예정일 = 마지막 생리 시작일 + 평균 주기</text><rect x="40" y="216" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">평균 주기</text><text x="250" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">생리 시작일에 더하는 날수</text><text x="580" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산</text><rect x="40" y="260" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="292" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">26일</text><text x="250" y="292" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">12일</text><text x="580" y="292" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">26 − 14</text><rect x="40" y="310" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="342" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">28일</text><text x="250" y="342" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">14일</text><text x="580" y="342" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">28 − 14</text><rect x="40" y="360" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="392" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">30일</text><text x="250" y="392" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">16일</text><text x="580" y="392" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">30 − 14</text><rect x="40" y="410" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="442" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">32일</text><text x="250" y="442" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">18일</text><text x="580" y="442" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">32 − 14</text><text x="40" y="504" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>