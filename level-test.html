<main>
  <div class="brand"><b>Lv.</b> 영어 단어 레벨 테스트</div>
  <h1>영어 단어 20개로 알아보는 내 어휘 수준</h1>
  <p class="sub">기초부터 실무 어휘까지 4단계, 총 20문제입니다. 5분이면 끝나요.</p>

  <div id="startScreen">
    <div class="start-card">
      <p>단어의 뜻을 보기 중에서 고르면 돼요.<br>모르는 문제는 편하게 찍고 넘어가셔도 됩니다.</p>
      <button class="start-btn" id="startBtn">테스트 시작하기</button>
    </div>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="progress-row">
      <span id="progressText">1 / 20</span>
      <span id="tierLabel"></span>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>

    <div class="question-card">
      <span class="tier-badge" id="tierBadge"></span>
      <div class="word-display" id="wordDisplay"></div>
      <div class="options" id="optionsWrap"></div>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-card">
      <div class="result-headline" id="resultHeadline"></div>
      <p class="result-sub" id="resultSub"></p>
      <div class="tier-bars" id="tierBars"></div>
      <button class="retry-btn" id="retryBtn">다시 테스트하기</button>
    </div>
  </div>

  <footer>
    이 테스트는 20개 표본 문항으로 어휘 수준을 대략적으로 가늠해보는 참고용 진단입니다.<br>
    공인 어학 시험 점수를 대체하지 않아요.
  </footer>
</main>

<script>
  const TIERS = ['기초', '중급', '고급', '실무'];

  const QUESTIONS = [
    // 기초
    { tier: '기초', word: 'happy', correct: '행복한', options: ['행복한', '슬픈', '피곤한', '바쁜'] },
    { tier: '기초', word: 'family', correct: '가족', options: ['학교', '가족', '친구', '이웃'] },
    { tier: '기초', word: 'weather', correct: '날씨', options: ['계절', '날씨', '기후변화', '온도'] },
    { tier: '기초', word: 'morning', correct: '아침', options: ['아침', '저녁', '밤', '오후'] },
    { tier: '기초', word: 'borrow', correct: '빌리다', options: ['빌리다', '빌려주다', '사다', '팔다'] },
    // 중급
    { tier: '중급', word: 'opportunity', correct: '기회', options: ['위기', '기회', '결과', '문제'] },
    { tier: '중급', word: 'achieve', correct: '달성하다', options: ['포기하다', '달성하다', '시작하다', '연기하다'] },
    { tier: '중급', word: 'environment', correct: '환경', options: ['경제', '환경', '사회', '정치'] },
    { tier: '중급', word: 'purpose', correct: '목적', options: ['방법', '목적', '결과', '원인'] },
    { tier: '중급', word: 'avoid', correct: '피하다', options: ['찾다', '피하다', '마주하다', '고르다'] },
    // 고급
    { tier: '고급', word: 'ambiguous', correct: '애매한', options: ['명확한', '애매한', '확실한', '단순한'] },
    { tier: '고급', word: 'resilience', correct: '회복력', options: ['취약성', '회복력', '지속성', '민감성'] },
    { tier: '고급', word: 'inevitable', correct: '불가피한', options: ['가능한', '불가피한', '선택적인', '드문'] },
    { tier: '고급', word: 'arbitrary', correct: '임의의', options: ['체계적인', '임의의', '필수적인', '고정된'] },
    { tier: '고급', word: 'plausible', correct: '그럴듯한', options: ['불가능한', '그럴듯한', '확정된', '모순된'] },
    // 실무 (토익/비즈니스)
    { tier: '실무', word: 'reimbursement', correct: '환급, 상환', options: ['환급, 상환', '할인', '연체료', '보증금'] },
    { tier: '실무', word: 'invoice', correct: '청구서, 송장', options: ['영수증 사본', '청구서, 송장', '계약서', '견적 요청서'] },
    { tier: '실무', word: 'negotiate', correct: '협상하다', options: ['협상하다', '거절하다', '승인하다', '보고하다'] },
    { tier: '실무', word: 'stakeholder', correct: '이해관계자', options: ['경쟁사', '이해관계자', '하청업체', '감사관'] },
    { tier: '실무', word: 'subsidiary', correct: '자회사', options: ['본사', '자회사', '지주회사', '협력업체'] }
  ];

  let current = 0;
  let answered = false;
  const scoreByTier = { '기초': 0, '중급': 0, '고급': 0, '실무': 0 };

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderQuestion() {
    answered = false;
    const q = QUESTIONS[current];
    document.getElementById('progressText').textContent = (current + 1) + ' / ' + QUESTIONS.length;
    document.getElementById('progressFill').style.width = ((current) / QUESTIONS.length * 100) + '%';
    document.getElementById('tierLabel').textContent = q.tier + ' 단계';
    document.getElementById('tierBadge').textContent = q.tier;
    document.getElementById('wordDisplay').textContent = q.word;

    const wrap = document.getElementById('optionsWrap');
    wrap.innerHTML = '';
    const shuffled = shuffle(q.options);
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectOption(btn, opt, q));
      wrap.appendChild(btn);
    });
  }

  function selectOption(btn, opt, q) {
    if (answered) return;
    answered = true;
    const isCorrect = opt === q.correct;
    if (isCorrect) {
      btn.classList.add('correct');
      scoreByTier[q.tier]++;
    } else {
      btn.classList.add('wrong');
      [...document.getElementById('optionsWrap').children].forEach(b => {
        if (b.textContent === q.correct) b.classList.add('correct');
      });
    }
    [...document.getElementById('optionsWrap').children].forEach(b => b.disabled = true);

    setTimeout(() => {
      current++;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 700);
  }

  function showResult() {
    quizScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');

    const totalCorrect = Object.values(scoreByTier).reduce((a, b) => a + b, 0);
    const questionsPerTier = 5;

    let levelIdx = -1;
    for (let i = TIERS.length - 1; i >= 0; i--) {
      if (scoreByTier[TIERS[i]] >= 3) { levelIdx = i; break; }
    }

    let headline, sub;
    if (levelIdx === 3) {
      headline = '실무 어휘까지 탄탄해요';
      sub = '비즈니스/토익 수준의 어휘도 잘 알고 계세요. 고급 어휘까지 꾸준히 넓혀가시면 좋겠어요.';
    } else if (levelIdx === 2) {
      headline = '고급 어휘 단계';
      sub = '수능~공무원 시험 수준의 어휘를 잘 알고 계세요. 실무/비즈니스 어휘로 확장해보시는 걸 추천드려요.';
    } else if (levelIdx === 1) {
      headline = '중급 어휘 단계';
      sub = '일상적인 표현은 탄탄해요. 고급 어휘로 넘어갈 준비가 된 단계예요.';
    } else if (levelIdx === 0) {
      headline = '기초 어휘 단계';
      sub = '기본기가 잡혀 있어요. 중급 어휘부터 차근차근 늘려가시면 좋겠어요.';
    } else {
      headline = '어휘 학습을 막 시작하는 단계';
      sub = '기초 단어부터 하나씩 쌓아가시면 금방 늘어요.';
    }

    document.getElementById('resultHeadline').textContent = headline + ` (총 ${totalCorrect}/20)`;
    document.getElementById('resultSub').textContent = sub;

    const barsWrap = document.getElementById('tierBars');
    barsWrap.innerHTML = '';
    TIERS.forEach(tier => {
      const correct = scoreByTier[tier];
      const pct = (correct / questionsPerTier) * 100;
      const row = document.createElement('div');
      row.className = 'tier-bar-row';
      row.innerHTML = `
        <div class="tier-bar-label"><span>${tier}</span><span>${correct} / ${questionsPerTier}</span></div>
        <div class="tier-bar-track"><div class="tier-bar-fill" style="width:${pct}%"></div></div>
      `;
      barsWrap.appendChild(row);
    });

    if (typeof gtag === 'function') {
      gtag('event', 'level_test_completed', { total_correct: totalCorrect, level_tier: TIERS[levelIdx] || 'below_basic' });
    }
  }

  function startQuiz() {
    current = 0;
    TIERS.forEach(t => scoreByTier[t] = 0);
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    renderQuestion();
  }

  startBtn.addEventListener('click', startQuiz);
  retryBtn.addEventListener('click', startQuiz);
</script>
