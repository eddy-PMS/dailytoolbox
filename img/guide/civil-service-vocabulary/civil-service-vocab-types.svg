<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img"><title>어휘 문제 유형과 단어장 칸</title><desc>빈칸 어휘, 바꿔 쓸 말, 업무 문서 속 뜻 — 유형별로 단어장 칸이 다르다</desc><rect width="800" height="540" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">어휘 문제 유형과 단어장 칸</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">빈칸 어휘</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">필요한 것: 같이 쓰는 짝, 품사</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">단어장 칸: 짝 표현, 예문</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">바꿔 쓸 말</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">필요한 것: 같은 뜻 묶음</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">단어장 칸: 함께 묶이는 단어들</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">업무 문서 뜻</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">필요한 것: 문서에서의 쓰임</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">단어장 칸: 어떤 문서에서 봤는지</text><text x="40" y="510" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>