<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>1살 = 7살이 아닌 이유</title><desc>강아지 1살은 사람 15세, 2살은 24세, 10살은 64세</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">1살 = 7살이 아닌 이유</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">중형견 기준: 첫 1년 = 15년, 둘째 1년 = 9년, 그 뒤 1년 = 약 5년</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">강아지 나이</text><text x="250" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">7을 곱하면</text><text x="430" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">실제 환산</text><text x="610" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">차이</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1살</text><text x="250" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">7세</text><text x="430" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15세</text><text x="610" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+8</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2살</text><text x="250" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">14세</text><text x="430" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">24세</text><text x="610" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+10</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5살</text><text x="250" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">35세</text><text x="430" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">39세</text><text x="610" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+4</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">10살</text><text x="250" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">70세</text><text x="430" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">64세</text><text x="610" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">−6</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">15살</text><text x="250" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">105세</text><text x="430" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">89세</text><text x="610" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">−16</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>