<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>글자 수에 맞는 도장 배치</title><desc>2~3자는 세로 한 줄, 4~6자는 두 줄 세로, 표시용 문구는 가로 한 줄</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">글자 수에 맞는 도장 배치</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">글자 수</text><text x="220" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">어울리는 배치</text><text x="410" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">비고</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2자</text><text x="220" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">세로 한 줄</text><text x="410" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">가장 단정해요</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3자</text><text x="220" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">세로 한 줄</text><text x="410" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">이름 도장에 흔한 모양</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4자</text><text x="220" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">두 줄 세로</text><text x="410" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">오른쪽 줄부터 읽는 전통 배치</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5~6자</text><text x="220" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">두 줄 세로</text><text x="410" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">글자가 작아지니 크기 확인</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">표시용 문구</text><text x="220" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">가로 한 줄</text><text x="410" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">“확인”, “검토필” 등</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>