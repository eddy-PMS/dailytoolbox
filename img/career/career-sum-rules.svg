<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" role="img"><title>여러 회사 경력 합산 규칙</title><desc>회사마다 기간을 구해 더하고, 30일은 1개월, 12개월은 1년으로 올린다. 공백 기간은 빠진다</desc><rect width="800" height="504" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">여러 회사 경력 합산 규칙</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">회사마다 년·월·일을 따로 구한다</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">회사 사이 공백 기간은 자동으로 빠져요</text><rect x="40" y="190" width="720" height="62" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">일수를 더해 30일이 되면 1개월</text><rect x="40" y="266" width="720" height="62" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="300" r="20" fill="#2b5fd9"/><text x="80" y="307" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="306" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">개월수를 더해 12개월이 되면 1년</text><rect x="40" y="342" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="376" r="20" fill="#2b5fd9"/><text x="80" y="383" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="382" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">총 일수도 같이 본다</text><text x="118" y="414" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">해석이 갈리지 않는 숫자 — 서류와 맞춰 보기 좋아요</text><text x="40" y="474" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>