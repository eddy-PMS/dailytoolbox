<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>25MB에 사진이 몇 장 들어가나</title><desc>Gmail 첨부 25MB에는 5MB 사진 5장, 1MB 사진 25장</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">25MB에 사진이 몇 장 들어가나</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">Gmail 첨부파일 합계 최대 25MB</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">사진 한 장 용량</text><text x="420" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">25MB에 들어가는 장수</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5MB</text><text x="420" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">5장</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2MB</text><text x="420" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">12장</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1MB</text><text x="420" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">25장</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">500KB (0.5MB)</text><text x="420" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50장</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>