<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img"><title>HSK 2.0과 HSK 3.0</title><desc>HSK 3.0은 3단계 9급, 2026년 12월 13일부터 시행</desc><rect width="800" height="424" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">HSK 2.0과 HSK 3.0</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">HSK 3.0 — 2026년 12월 13일부터 정식 시행(중국고시센터)</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">항목</text><text x="205" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">지금(HSK 2.0)</text><text x="410" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">HSK 3.0</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">급수 체계</text><text x="205" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1급 ~ 6급 (6단계)</text><text x="410" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3단계 9급 (초급·중급·고급)</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">평가 영역</text><text x="205" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">듣기·독해·쓰기</text><text x="410" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">듣기·말하기·읽기·쓰기 + 고급은 번역</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">어휘·한자·문법</text><text x="205" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">기존 요강</text><text x="410" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전면 재구성</text><text x="40" y="350" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">HSK 3.0 급수별 어휘 수는 새 요강에서 확인하세요(이 그림에는 넣지 않았어요).</text><text x="40" y="394" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>