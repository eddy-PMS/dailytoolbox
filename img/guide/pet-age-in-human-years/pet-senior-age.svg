<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>몇 살부터 노령인가요</title><desc>소형견 7살 무렵, 대형견 5~6살 무렵, 고양이 7살 무렵부터 노령</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">몇 살부터 노령인가요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구분</text><text x="250" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">노령으로 보는 시기</text><text x="590" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">근거</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">소형견</text><text x="250" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">7살 무렵</text><text x="590" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">AVMA</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">대형견</text><text x="250" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">5~6살 무렵</text><text x="590" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">AVMA</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">고양이</text><text x="250" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">7살 무렵</text><text x="590" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">AVMA</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">고양이 (단계 구분)</text><text x="250" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">7~10살 중년, 10살 넘으면 시니어</text><text x="590" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">AAHA/AAFP 2021</text><text x="40" y="366" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">일반 정보예요. 검진 주기는 동물병원에서 상담해 정하세요.</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>