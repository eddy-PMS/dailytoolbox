<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 588" role="img"><title>이럴 때 사다리는 이렇게 움직여요</title><desc>참가자 2명 이상, 결과가 모자라면 꽝으로 채우고 남으면 버린다</desc><rect width="800" height="588" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">이럴 때 사다리는 이렇게 움직여요</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">참가자가 1명</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">만들어지지 않아요. 2명 이상이어야 합니다</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">결과가 참가자보다 적을 때</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">모자란 칸이 꽝으로 자동으로 채워져요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">결과가 참가자보다 많을 때</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">참가자 수만큼만 쓰고 나머지는 버려요</text><rect x="40" y="398" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">참가자가 많을 때</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">인원 제한은 없지만 가로로 넓어져요</text><text x="118" y="498" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">휴대폰에서는 10명 안팎이 보기 편해요</text><text x="40" y="558" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>