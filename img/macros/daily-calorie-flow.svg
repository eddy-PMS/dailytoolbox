<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>하루 칼로리 계산 순서</title><desc>기초대사량에 활동량 계수를 곱해 유지 칼로리를 구하고 목표에 따라 조정</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">하루 칼로리 계산 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">기초대사량 (BMR)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">성별·나이·키·몸무게로 계산 (Mifflin-St Jeor 공식)</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">× 활동량 계수</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">현재 체중을 유지하는 칼로리 (TDEE)</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">목표에 맞게 조정</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">다이어트 −20% · 린매스업 +10% · 벌크업 +20%</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>