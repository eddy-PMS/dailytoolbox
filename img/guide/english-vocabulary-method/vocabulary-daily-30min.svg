<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>하루 30분 흐름</title><desc>새 단어 15분, 소리 듣기 3분, 받아쓰기 7분, 목록 정리 2분, 자기 전 훑기 3분</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">하루 30분 흐름</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">순서</text><text x="120" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">하는 일</text><text x="600" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">시간</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1</text><text x="120" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">새 단어 뜻·예문 익히기</text><text x="600" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">15분</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2</text><text x="120" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">소리 한 번 듣기</text><text x="600" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3분</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3</text><text x="120" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">어제 분량 받아쓰기</text><text x="600" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">7분</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4</text><text x="120" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">틀린 것만 목록에 추가</text><text x="600" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2분</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5</text><text x="120" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">자기 전 오늘 분량 뜻만 훑기</text><text x="600" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3분</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>