<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1088" role="img"><title>헷갈리는 가타카나 묶음</title><desc>シ와 ツ, ソ와 ン 등 헷갈리는 가타카나 구별하는 점</desc><rect width="800" height="1088" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">헷갈리는 가타카나 묶음</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">シ(시) / ツ(츠)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">シ는 점 두 개가 위아래로 쌓이고 긴 획을 아래에서 위로 올려요.</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">ツ는 점 두 개가 옆으로 나란하고 긴 획을 위에서 아래로 내려요</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ソ(소) / ン(응)</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">ソ는 점이 위에서 아래로 서 있고 긴 획도 위에서 아래로. ン은</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">점이 옆으로 누워 있고 긴 획은 아래에서 위로</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ク(쿠) / ケ(케) / タ(타)</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">ク는 획이 2개, ケ는 가로획이 길게 튀어나오고, タ는 ク 안에</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">짧은 획이 하나 더 있어요</text><rect x="40" y="482" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="516" r="20" fill="#2b5fd9"/><text x="80" y="523" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="522" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ウ(우) / ワ(와) / フ(후)</text><text x="118" y="554" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">위에 꼭지가 있으면 ウ, 꼭지 없이 왼쪽 세로획이 있으면 ワ,</text><text x="118" y="582" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">세로획도 없으면 フ</text><rect x="40" y="614" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="648" r="20" fill="#2b5fd9"/><text x="80" y="655" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="654" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">コ(코) / ユ(유)</text><text x="118" y="686" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">ユ는 아래 가로획이 오른쪽으로 길게 나와요</text><rect x="40" y="718" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="752" r="20" fill="#2b5fd9"/><text x="80" y="759" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="118" y="758" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">チ(치) / テ(테)</text><text x="118" y="790" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">チ는 맨 위 획이 비스듬하고 세로획이 가로획을 뚫고 나와요</text><rect x="40" y="822" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="856" r="20" fill="#2b5fd9"/><text x="80" y="863" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="118" y="862" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ス(스) / ヌ(누)</text><text x="118" y="894" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">오른쪽 아래 획이 왼쪽 획을 가로지르면 ヌ</text><rect x="40" y="926" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="960" r="20" fill="#2b5fd9"/><text x="80" y="967" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">8</text><text x="118" y="966" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ア(아) / マ(마)</text><text x="118" y="998" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">ア는 아래 획이 세로로 길게 내려오고, マ는 짧은 점으로 끝나요</text><text x="40" y="1058" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>