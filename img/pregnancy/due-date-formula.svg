<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img"><title>출산예정일 계산법</title><desc>출산예정일은 마지막 생리 시작일에 280일(40주)을 더한 날</desc><rect width="800" height="356" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">출산예정일 계산법</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">마지막 생리 시작일 + 280일 (40주)</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 마지막 생리 시작일 2026년 7월 1일</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">→ 출산예정일 2027년 4월 7일</text><text x="40" y="256" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">네겔레 법칙. 생리 주기가 28일보다 길거나 짧으면 그 차이만큼 보정해요.</text><text x="40" y="282" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">임신 주수도 같은 기준이라 마지막 생리일이 0주 0일이에요.</text><text x="40" y="326" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>