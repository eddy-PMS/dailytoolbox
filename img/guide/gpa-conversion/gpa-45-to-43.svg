<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img"><title>4.5 → 4.3 환산 (단순 비례, 참고용)</title><desc>단순 비례로 4.5 만점 4.0은 4.3 만점 3.82</desc><rect width="800" height="574" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">4.5 → 4.3 환산 (단순 비례, 참고용)</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">평점 × 4.3 ÷ 4.5</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">4.5 만점 평점</text><text x="420" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">4.3 만점으로</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.0</text><text x="420" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2.87</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.5</text><text x="420" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.34</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3.8</text><text x="420" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.63</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4.0</text><text x="420" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.82</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4.2</text><text x="420" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4.01</text><rect x="40" y="416" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="448" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4.5</text><text x="420" y="448" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">4.30</text><text x="40" y="500" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">두 체계를 정확히 환산하는 공식은 없어요. 단순 비례는 참고용입니다.</text><text x="40" y="544" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>