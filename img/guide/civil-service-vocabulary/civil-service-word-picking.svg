<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 636" role="img"><title>공무원 영단어 고르는 순서</title><desc>예시문제, 예시문제 속 모르는 단어, 전환 이후 기출, 교재, 전환 이전 기출 순서</desc><rect width="800" height="636" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">공무원 영단어 고르는 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">예시문제를 먼저 푼다</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">교재보다 먼저</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">예시문제의 모르는 단어를 전부 가져온다</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">양이 적어 다 가져와도 부담이 없어요</text><rect x="40" y="294" width="720" height="62" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">기조 전환 이후 기출을 같은 방식으로</text><rect x="40" y="370" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="404" r="20" fill="#2b5fd9"/><text x="80" y="411" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="410" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">그 다음에 교재를 본다</text><text x="118" y="442" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">빠진 영역을 메우는 용도</text><rect x="40" y="474" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="508" r="20" fill="#2b5fd9"/><text x="80" y="515" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="514" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">전환 이전 기출은 어휘 확인용으로만</text><text x="118" y="546" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">유형 연습용으로는 거리가 있어요</text><text x="40" y="606" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>