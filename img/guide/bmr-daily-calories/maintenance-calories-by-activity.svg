<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>활동량별 유지 칼로리 (kcal)</title><desc>활동계수 1.2~1.9. 30세 남 175cm·70kg 보통 활동이면 2,556kcal</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">활동량별 유지 칼로리 (kcal)</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">유지 칼로리 = 기초대사량 × 활동계수 · 30세 기준</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">활동량</text><text x="380" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계수</text><text x="450" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">남 175cm·70kg</text><text x="610" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">여 162cm·55kg</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">거의 안 움직임 (사무직, 운동 안 함)</text><text x="380" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1.2</text><text x="450" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1,979</text><text x="610" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1,502</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">가벼운 활동 (주 1~3회 운동)</text><text x="380" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1.375</text><text x="450" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2,267</text><text x="610" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1,721</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">보통 활동 (주 3~5회 운동)</text><text x="380" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1.55</text><text x="450" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2,556</text><text x="610" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1,940</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">활발 (주 6~7회 운동)</text><text x="380" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1.725</text><text x="450" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2,844</text><text x="610" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2,159</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">매우 활발 (육체노동 + 운동)</text><text x="380" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1.9</text><text x="450" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3,133</text><text x="610" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2,378</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>