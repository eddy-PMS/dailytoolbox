<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>기준일에 넣을 날짜</title><desc>시험은 원서 마감일·시험일, 보험은 가입일, 계약은 계약일을 기준일로</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">기준일에 넣을 날짜</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">이럴 때</text><text x="300" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">기준일에 넣을 날짜</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">시험 응시 자격</text><text x="300" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">원서 접수 마감일 또는 시험일</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">보험 가입 나이</text><text x="300" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">가입일</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">계약서에 적을 나이</text><text x="300" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">계약일</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">지원 자격 확인</text><text x="300" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">공고에 적힌 기준일</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>