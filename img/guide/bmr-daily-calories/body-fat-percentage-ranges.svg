<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>체지방률 범위</title><desc>ACE 분류: 평균은 남성 18~24%, 여성 25~31%</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">체지방률 범위</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">분류</text><text x="330" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">남성</text><text x="560" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">여성</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">필수지방</text><text x="330" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">2~5%</text><text x="560" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">10~13%</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">운동선수</text><text x="330" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">6~13%</text><text x="560" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">14~20%</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">피트니스(건강)</text><text x="330" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">14~17%</text><text x="560" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">21~24%</text><r