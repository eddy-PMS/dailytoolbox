<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>사인 만드는 두 가지 방법</title><desc>글꼴로 만들면 몇 초에 깔끔하고, 직접 그리면 나만의 모양</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">사인 만드는 두 가지 방법</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"></text><text x="200" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">글꼴로 만들기</text><text x="470" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">직접 그리기</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">걸리는 시간</text><text x="200" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">몇 초</text><text x="470" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">몇 번 연습 필요</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">모양</text><text x="200" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">깔끔하고 일정함</text><text x="470" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">나만의 모양</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">단점</text><text x="200" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">같은 글꼴이면 모양이 같음</text><text x="470" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">마우스로는 손맛이 안 남</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">어울리는 곳</text><text x="200" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">사내 문서, 양식의 서명란</text><text x="470" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">평소 서명을 옮길 때</text><text x="40" y="366" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">직접 그릴 때는 휴대폰·태블릿에서 손가락이나 펜으로 그리면 자연스러워요.</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>