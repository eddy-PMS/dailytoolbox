<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>강아지 고양이 나이 계산기 - 사람 나이로 환산</title>
<meta name="description" content="반려견·반려묘의 나이를 사람 나이로 환산해주는 무료 계산기. 강아지는 크기별, 최신 연구 공식 반영.">
<meta name="keywords" content="강아지 나이 계산, 고양이 나이 계산, 강아지 사람 나이, 고양이 사람 나이 환산, 반려동물 나이">
<link rel="canonical" href="https://dailyfreetoolbox.com/pet-age.html">
<meta property="og:type" content="website">
<meta property="og:title" content="강아지 고양이 나이 계산기">
<meta property="og:description" content="반려견·반려묘의 나이를 사람 나이로 환산해주는 무료 계산기. 강아지는 크기별, 최신 연구 공식 반영.">
<meta property="og:url" content="https://dailyfreetoolbox.com/pet-age.html">
<meta property="og:locale" content="ko_KR">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebApplication", "name": "강아지 고양이 나이 계산기", "url": "https://dailyfreetoolbox.com/pet-age.html", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "KRW"}, "description": "반려견·반려묘의 나이를 사람 나이로 환산해주는 무료 계산기. 강아지는 크기별, 최신 연구 공식 반영."}
</script>
<script src="common.js"></script>
<link rel="stylesheet" href="tool.css">
<style>:root { --accent:#7a5a2a; --accent-deep:#5c4320; }</style>

</head>
<body>

<nav id="site-nav" data-accent="#7a5a2a"></nav>
<script src="nav.js"></script>

<main>
  <div class="brand"><b>🐾 강아지·고양이 나이 계산기</b></div>
  <h1>우리 아이는 사람 나이로 몇 살일까요</h1>
  <p class="sub">강아지는 크기에 따라 노화 속도가 달라요. 소형·중형·대형 기준표와 2019년 UCSD 연구의 공식을 함께 보여드려요. 고양이는 수의학계 표준 환산표를 써요.</p>

  <div class="card">
    <div class="grid2">
      <div class="field"><label>반려동물</label><select id="type"><option value="dog">강아지</option><option value="cat">고양이</option></select></div>
      <div class="field" id="sizeWrap"><label>크기 (성견 체중)</label><select id="size"><option value="s">소형 (~10kg)</option><option value="m">중형 (10~25kg)</option><option value="l">대형 (25kg~)</option></select></div>
      <div class="field"><label>나이</label><div class="unit"><input type="number" id="age" value="3" min="0" max="30" step="0.5"><span>살</span></div></div>
    </div>
    <div id="out" style="margin-top:14px"></div>
  </div>
 
  <footer>환산은 참고용이며 품종·건강 상태에 따라 달라요.</footer>
</main>

<script>

const $=id=>document.getElementById(id);
function dogAge(a,size){ if(a<=0) return 0; if(a<=1) return 15*a; if(a<=2) return 15+9*(a-1); const per={s:4,m:5,l:6.5}[size]; return 24+(a-2)*per; }
function catAge(a){ if(a<=0) return 0; if(a<=1) return 15*a; if(a<=2) return 15+9*(a-1); return 24+(a-2)*4; }
function stage(h){ return h<18?'어린이·청소년':h<40?'청년':h<60?'중년':h<75?'노년 초기':'노년'; }
function calc(){
  const t=$('type').value, a=+$('age').value||0, size=$('size').value; $('sizeWrap').classList.toggle('hidden',t!=='dog');
  const h= t==='dog'? dogAge(a,size) : catAge(a);
  const ucsd= t==='dog'&&a>0? 16*Math.log(a)+31 : null;
  $('out').innerHTML=`<div class="big-result">사람 나이 약 ${Math.round(h)}세<small>${stage(h)}</small></div>
    <table style="margin-top:12px"><tbody><tr><td>계산 방식</td><td class="r">${t==='dog'?'1살=15세, 2살=24세, 이후 크기별 연 '+({s:4,m:5,l:6.5}[size])+'세':'1살=15세, 2살=24세, 이후 연 4세'}</td></tr>${ucsd?`<tr><td>UCSD 연구 공식 (16×ln(나이)+31)</td><td class="r">약 ${Math.round(ucsd)}세</td></tr>`:''}</tbody></table>
    <div class="note">${t==='dog'?'대형견은 소형견보다 빨리 늙어 7살부터 노령견 관리를 시작하는 게 좋아요.':'고양이는 7~10살부터 노령묘로 봅니다.'} 건강검진은 1년에 한 번, 노령기엔 6개월에 한 번이 권장돼요.</div>`;
}
['type','size','age'].forEach(id=>$(id).addEventListener('input',calc)); calc();
let sent=false; $('age').addEventListener('input',()=>{ if(!sent&&typeof gtag==='function'){ gtag('event','pet_age_calculated',{}); sent=true; } });
 
</script>

</body>
</html>
