<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>어디에 어떤 나이를 쓰나요</title><desc>계약·행정·병원은 만 나이, 술·담배·병역은 연 나이</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">어디에 어떤 나이를 쓰나요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">상황</text><text x="430" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">적용 나이</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">계약·법률·행정 서류, 병원 진료</text><text x="430" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">만 나이</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">초등학교 입학 (만 6세가 되는 해 3월)</text><text x="430" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">연 나이 기준으로 운영</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">술·담배 구매, 병역 판정</text><text x="430" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">연 나이 (19세 되는 해 1월 1일부터)</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">정년·연금 수급</text><text x="430" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">만 나이</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>