<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img"><title>키 172cm라면 몸무게별 BMI 구간</title><desc>키 172cm일 때 BMI 구간이 바뀌는 몸무게 예시</desc><rect width="800" height="574" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">키 172cm라면 몸무게별 BMI 구간</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">BMI 기준(대한비만학회)에 키 172cm를 넣어 계산한 예시</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구간</text><text x="330" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">BMI</text><text x="520" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">몸무게</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">저체중</text><text x="330" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">18.5 미만</text><text x="520" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">54.7kg 미만</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">정상</text><text x="330" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">18.5 ~ 22.9</text><text x="520" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">54.7 ~ 67.7kg</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">과체중 (비만 전단계)</text><text x="330" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">23 ~ 24.9</text><text x="520" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">68.0kg부터</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1단계 비만</text><text x="330" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">25 ~ 29.9</text><text x="520" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">74.0kg부터</text><rect x="40" y="366" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="398" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2단계 비만</text><text x="330" y="398" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">30 ~ 34.9</text><text x="520" y="398" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">88.8kg부터</text><rect x="40" y="416" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="448" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3단계 비만 (고도비만)</text><text x="330" y="448" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">35 이상</text><text x="520" y="448" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">103.5kg부터</text><text x="40" y="500" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">몸무게 = BMI × 키(m)². 키가 다르면 계산기에 직접 넣어 확인하세요.</text><text x="40" y="544" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>