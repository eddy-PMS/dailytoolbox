<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 518" role="img"><title>통신사에 내 기록을 물어볼 수 있나요</title><desc>내 정보는 개인정보 보호법·위치정보법으로 열람 요구, 남의 접속 기록은 수사기관이 법원 허가로만</desc><rect width="800" height="518" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">통신사에 내 기록을 물어볼 수 있나요</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">내 개인정보 열람 요구</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">개인정보 보호법 제35조 — 요구하면 10일 안에 열람</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">내 위치정보 이용·제공사실 열람</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">위치정보법 제24조 제3항</text><rect x="40" y="294" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">남의 접속 기록(통신사실 확인자료)</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">통신비밀보호법 제13조 — 검사·사법경찰관이</text><text x="118" y="394" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">법원 허가를 받아 요청하는 절차, 개인이 받는 길은 없음</text><text x="40" y="444" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">본인 확인 방법·보관 기간은 통신사마다 달라요. 가입한 통신사 고객센터에 문의하세요.</text><text x="40" y="488" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>