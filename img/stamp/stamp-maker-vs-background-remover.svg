<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img"><title>새로 만들까, 찍은 도장을 쓸까</title><desc>도장이 없으면 도장 만들기, 실제 찍은 도장이 있으면 배경 제거</desc><rect width="800" height="340" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">새로 만들까, 찍은 도장을 쓸까</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">상황</text><text x="470" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">쓸 도구</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">도장이 없고 이미지만 필요하다</text><text x="470" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">도장 만들기</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">실제 도장을 찍은 종이가 있다</text><text x="470" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">배경 제거</text><text x="40" y="266" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">찍은 도장은 흰 종이에 또렷하게 찍어 사진·스캔한 뒤 종이 색을 지우면 투명 PNG가 돼요.</text><text x="40" y="310" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>