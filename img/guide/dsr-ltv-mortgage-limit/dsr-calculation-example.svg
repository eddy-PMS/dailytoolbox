<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" role="img"><title>DSR 계산 예시</title><desc>연봉 6,000만원에 주담대 3억원이면 실제 DSR 약 28.6%, 스트레스 DSR 약 39.9%</desc><rect width="800" height="374" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">DSR 계산 예시</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">연봉 6,000만원 · 주담대 3억원 · 연 4.0% · 30년 원리금균등</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구분</text><text x="330" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">계산 금리</text><text x="500" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">연간 원리금</text><text x="660" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">DSR</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">실제 상환 기준</text><text x="330" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.0%</text><text x="500" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 1,719만원</text><text x="660" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 28.6%</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">스트레스 DSR (가산 3.0%p)</text><text x="330" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">7.0%</text><text x="500" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 2,395만원</text><text x="660" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">약 39.9%</text><text x="40" y="300" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">DSR(%) = 모든 대출의 연간 원리금 상환액 ÷ 연소득 × 100</text><text x="40" y="344" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>