<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>절약법은 무엇을 재나</title><desc>절약법은 다시 외울 때 시간이 얼마나 절약되는지를 잰다</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">절약법은 무엇을 재나</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">묻지 않은 것</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">지금 몇 개를 기억하고 있나</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">잰 것</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">다시 외울 때 시간이 얼마나 절약되는가</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">예: 20분 뒤 58%</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">다시 외우는 데 처음의 42% 정도 노력이면 됐다는 뜻에 가까워요</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>