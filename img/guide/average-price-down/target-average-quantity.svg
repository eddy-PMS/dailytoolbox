<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img"><title>목표 평단까지 얼마나 더 사야 하나</title><desc>평단 8,000원을 만들려면 100주, 7,000원은 300주가 필요</desc><rect width="800" height="574" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">목표 평단까지 얼마나 더 사야 하나</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">기존 수량 × (기존 평단 − 목표 평단) ÷ (목표 평단 − 현재가)</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">목표 평단</text><text x="230" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">추가 수량</text><text x="410" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">추가 금액</text><text x="600" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">본전까지</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">9,000원</text><text x="230" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 34주</text><text x="410" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">약 20만원</text><text x="600" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+50.0%</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">8,500원</text><text x="230" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">60주</text><text x="410" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">36만원</text><text x="600" y="248" font-size="18" font-weight="400" fill="#1e4