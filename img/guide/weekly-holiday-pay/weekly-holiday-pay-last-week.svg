<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img"><title>퇴사하는 주의 주휴수당</title><desc>금요일까지 일하고 토요일 자 퇴직이면 미발생, 월요일 자 퇴직이면 발생</desc><rect width="800" height="356" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">퇴사하는 주의 주휴수당</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">마지막 근무일</text><text x="230" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">근로관계가 끝나는 시점</text><text x="600" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">주휴수당</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">금요일</text><text x="230" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">금요일까지 (토요일 자 퇴직)</text><text x="600" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">미발생</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">금요일</text><text x="230" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">일요일까지 유지 (월요일 자 퇴직)</text><text x="600" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">발생</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">수요일</text><text x="230" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">수요일까지</text><text x="600" y="264" font-size="18" font-weight="400" fill=