<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img"><title>DSR · LTV · 스트레스 DSR 뜻</title><desc>LTV는 집값, DSR은 소득, 스트레스 DSR은 금리 변동을 본다</desc><rect width="800" height="540" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">DSR · LTV · 스트레스 DSR 뜻</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">LTV (담보인정비율)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보는 것: 집값</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">집값의 몇 %까지 빌릴 수 있는지</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">DSR (총부채원리금상환비율)</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보는 것: 소득</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1년에 갚는 모든 대출의 원금+이자가 연소득의 몇 %인지</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">스트레스 DSR</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보는 것: 금리 변동</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">DSR을 계산할 때 실제 금리에 가산금리를 얹어 보는 방식</text><text x="40" y="510" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>