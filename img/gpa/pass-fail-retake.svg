<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 644" role="img"><title>P·F·재수강 과목 넣는 법</title><desc>P 과목은 계산에서 빠지고, F는 0점, 재수강은 새 성적만 넣는다</desc><rect width="800" height="644" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">P·F·재수강 과목 넣는 법</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">P(패스) 과목</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">이 계산기: 성적을 “P”로 두면 계산에서 빠져요</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">흔한 규정: 평점에 넣지 않고 이수 학점만 인정</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">F 과목</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">이 계산기: 0점으로 계산돼요</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">흔한 규정: 평점에 넣는 곳이 많음</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">재수강</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">이 계산기: 새 성적만 넣으세요</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">흔한 규정: 원래 성적을 대체, 상한을 두는 곳도 있음</text><rect x="40" y="482" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="516" r="20" fill="#2b5fd9"/><text x="80" y="523" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="522" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">전공 평점만</text><text x="118" y="554" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">전공 과목만 넣으면 됩니다</text><text x="40" y="614" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>