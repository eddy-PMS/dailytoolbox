<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>랜덤 추첨, 이렇게 뽑혀요</title><desc>브라우저 난수를 쓰고 저장하지 않으며 여러 개는 중복 없이 뽑는다</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">랜덤 추첨, 이렇게 뽑혀요</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">저장하지 않아요</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">브라우저의 난수를 쓰고 결과가 어디에도 저장되지 않아요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">중복 없이</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">여러 개를 뽑을 때는 같은 항목이 두 번 뽑히지 않아요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">확률 높이기</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">같은 항목을 여러 번 입력하면 그만큼 높아져요</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">경품 추첨처럼 공정성이 필요하면 화면을 공유하면서 뽑으세요.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>