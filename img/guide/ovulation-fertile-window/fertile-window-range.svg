<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img"><title>가임기 범위 (7일)</title><desc>가임기는 배란 예상일 5일 전부터 1일 후까지 7일</desc><rect width="800" height="320" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">가임기 범위 (7일)</text><rect x="40.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">가임기 시작</text><text x="216.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">배란 예상일 − 5일</text><text x="216.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle"></text><rect x="407.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">가임기 끝</text><text x="583.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">배란 예상일 + 1일</text><text x="583.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle"></text><text x="40" y="246" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">이 사이트 배란일 도구 기준이에요. 기관마다 안내하는 범위가 조금씩 달라요.</text><text x="40" y="290" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>