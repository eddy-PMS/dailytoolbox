<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>84㎡ 아파트를 34평형이라고 하는 이유</title><desc>전용면적 84㎡는 25.41평, 분양 광고의 34평형은 공급면적 기준</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">84㎡ 아파트를 34평형이라고 하는 이유</text><rect x="40.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">전용면적 84㎡를 평으로</text><text x="216.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">25.41평</text><text x="216.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">84 ÷ 3.305785</text><rect x="407.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">분양 광고</text><text x="583.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">34평형</text><text x="583.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">공급면적 기준</text><rect x="40" y="238" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="267" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">면적</text><text x="230" y="267" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">무엇을 잰 값인가</text><rect x="40" y="282" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">전용면적</text><text x="230" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">현관 안쪽에서 실제로 쓰는 공간</text><rect x="40" y="332" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">공급면적</text><text x="230" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전용면적 + 주거공용면적(계단·복도)</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>