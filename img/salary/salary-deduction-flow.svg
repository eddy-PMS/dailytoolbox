<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 588" role="img"><title>월급 실수령액이 나오는 순서</title><desc>세전 연봉에서 4대보험과 소득세·지방소득세를 빼면 실수령액</desc><rect width="800" height="588" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">월급 실수령액이 나오는 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">연봉(세전)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">연봉 4,000만원이면 월 세전 약 333만원</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">4대보험 빼기</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">국민연금 · 건강보험 · 장기요양보험 · 고용보험</text><rect x="40" y="294" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">세금 빼기</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로소득세 + 지방소득세(소득세의 10%)</text><text x="118" y="394" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">부양가족 수와 비과세 항목에 따라 달라져요</text><rect x="40" y="426" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="460" r="20" fill="#2b5fd9"/><text x="80" y="467" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="466" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">월 실수령액</text><text x="118" y="498" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">연봉 4,000만원이면 292만원 안팎</text><text x="40" y="558" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>