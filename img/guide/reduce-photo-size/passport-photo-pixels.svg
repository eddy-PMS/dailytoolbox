<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img"><title>여권 사진 3.5 × 4.5cm는 몇 픽셀</title><desc>여권 사진 3.5cm × 4.5cm는 300dpi에서 413 × 531픽셀</desc><rect width="800" height="330" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">여권 사진 3.5 × 4.5cm는 몇 픽셀</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">413 × 531픽셀 (온라인 신청용 권장)</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">3.5cm ÷ 2.54 × 300 ≈ 413픽셀</text><text x="66" y="208" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">4.5cm ÷ 2.54 × 300 ≈ 531픽셀</text><text x="40" y="256" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">출처: 외교부 여권안내</text><text x="40" y="300" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>