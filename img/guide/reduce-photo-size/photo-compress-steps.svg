<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" role="img"><title>브라우저에서 사진 용량 줄이는 순서</title><desc>사진 고르기, 최대 크기, 품질, 형식, 압축하기, 저장 6단계</desc><rect width="800" height="768" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">브라우저에서 사진 용량 줄이는 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">사진 고르기</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">여러 장을 한꺼번에 선택할 수 있어요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">최대 가로·세로 정하기</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">기본값 1920px, 비율은 그대로 유지</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">품질 정하기</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">30%~100%, 기본값 80%</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">형식 고르기</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">JPG, WEBP, PNG 중 하나</text><rect x="40" y="502" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="536" r="20" fill="#2b5fd9"/><text x="80" y="543" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="542" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">압축하기</text><text x="118" y="574" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">줄이기 전후 크기와 용량이 표시돼요</text><rect x="40" y="606" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="640" r="20" fill="#2b5fd9"/><text x="80" y="647" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="118" y="646" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">저장</text><text x="118" y="678" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">파일 이름 끝에 _min 이 붙어 원본을 덮어쓰지 않아요</text><text x="40" y="738" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>