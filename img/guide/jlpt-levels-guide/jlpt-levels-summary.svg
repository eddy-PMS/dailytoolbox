<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>JLPT 등급별 수준</title><desc>N5는 기본 일본어를 어느 정도 이해, N1은 폭넓은 장면의 일본어를 이해</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">JLPT 등급별 수준</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">등급</text><text x="170" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">한마디로</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N5</text><text x="170" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">기본 일본어를 어느 정도 이해</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N4</text><text x="170" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">기본 일본어를 이해</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N3</text><text x="170" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">일상 일본어를 어느 정도 이해</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N2</text><text x="170" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">일상 + 폭넓은 장면의 일본어를 어느 정도 이해</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N1</text><text x="170" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">폭넓은 장면의 일본어를 이해</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>