<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img"><title>하루 단백질, 얼마나 먹나</title><desc>체중 1kg당 1.6~2.0g. 70kg이면 하루 112~140g</desc><rect width="800" height="330" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">하루 단백질, 얼마나 먹나</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">체중 1kg당 1.6 ~ 2.0g</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 체중 70kg</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">70 × 1.6 ~ 2.0 = 하루 112 ~ 140g</text><text x="40" y="256" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">지방은 체중 1kg당 0.8~1g을 유지하고, 나머지 칼로리를 탄수화물로 채워요.</text><text x="40" y="300" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>