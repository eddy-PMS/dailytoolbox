<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img"><title>강아지 나이 환산 방식</title><desc>2살까지는 같고 3살부터 소형 +4세, 중형 +5세, 대형 +6.5세</desc><rect width="800" height="390" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">강아지 나이 환산 방식</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구간</text><text x="270" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">소형 (~10kg)</text><text x="440" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">중형 (10~25kg)</text><text x="620" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">대형 (25kg~)</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1살까지</text><text x="270" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15세</text><text x="440" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">15세</text><text x="620" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">15세</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2살까지</text><text x="270" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">+9세 (24세)</text><text x="440" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">+9세 (24세)</text><text x="620" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+9세 (24세)</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3살부터 1년마다</text><text x="270" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">+4세</text><text x="440" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">+5세</text><text x="620" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">+6.5세</text><text x="40" y="316" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">사람 나이 = 24 + (강아지 나이 − 2) × 크기별 숫자 (2살 이후)</text><text x="40" y="360" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>