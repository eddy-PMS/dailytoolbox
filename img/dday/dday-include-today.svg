<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img"><title>디데이 계산, 오늘을 포함하나요</title><desc>시험은 오늘을 빼고 세고, 기념일은 첫날을 1일로 센다. 100일 기념일은 99일 뒤</desc><rect width="800" height="414" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">디데이 계산, 오늘을 포함하나요</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">세는 방식이 두 가지예요</text><rect x="40" y="120" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="154" r="20" fill="#2b5fd9"/><text x="80" y="161" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="160" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">시험·마감 — 오늘 제외</text><text x="118" y="192" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">D-3이면 3일 뒤가 시험</text><rect x="40" y="224" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="258" r="20" fill="#2b5fd9"/><text x="80" y="265" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="264" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">기념일 — 첫날이 1일</text><text x="118" y="296" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">100일 기념일은 사귄 날로부터 99일 뒤</text><text x="118" y="324" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">계산기의 '당일 포함' 옵션을 켜세요</text><text x="40" y="384" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>