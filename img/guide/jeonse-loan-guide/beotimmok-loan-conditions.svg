<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 792" role="img"><title>버팀목 전세대출 조건</title><desc>버팀목 일반·청년전용·신혼부부전용의 소득, 보증금 상한, 대출 한도, 금리</desc><rect width="800" height="792" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">버팀목 전세대출 조건</text><rect x="40" y="86" width="720" height="202" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">버팀목(일반)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대상: 무주택 세대주</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">부부합산 연소득 5천만원 이하 · 순자산 3.45억원 이하</text><text x="118" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보증금 상한 수도권 3억 / 그 외 2억</text><text x="118" y="242" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대출 한도 수도권 1.2억 / 그 외 8천만원 (보증금의 70% 이내)</text><text x="118" y="270" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">금리 연 2.5~3.5%</text><rect x="40" y="302" width="720" height="202" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="336" r="20" fill="#2b5fd9"/><text x="80" y="343" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="342" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">청년전용 버팀목</text><text x="118" y="374" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대상: 만 19~34세 무주택 세대주(예비 세대주 포함)</text><text x="118" y="402" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">부부합산 연소득 5천만원 이하 · 순자산 3.45억원 이하</text><text x="118" y="430" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보증금 상한 3억원</text><text x="118" y="458" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대출 한도 1.5억원 (보증금의 80% 이내)</text><text x="118" y="486" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">금리 연 2.2~3.3%</text><rect x="40" y="518" width="720" height="202" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="552" r="20" fill="#2b5fd9"/><text x="80" y="559" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="558" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">신혼부부전용</text><text x="118" y="590" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대상: 혼인 7년 이내 또는 3개월 내 결혼 예정</text><text x="118" y="618" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">부부합산 연소득 7,500만원 이하 · 순자산 3.45억원 이하</text><text x="118" y="646" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보증금 상한 수도권 4억 / 그 외 3억</text><text x="118" y="674" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대출 한도 수도권 2.5억 / 그 외 1.6억 (보증금의 80% 이내)</text><text x="118" y="702" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">금리 연 1.9~3.3%</text><text x="40" y="762" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>