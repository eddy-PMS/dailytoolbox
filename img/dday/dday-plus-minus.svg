<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" role="img"><title>D- 와 D+ 의 차이</title><desc>D-는 목표일까지 남은 날, D+는 목표일이 지난 뒤 경과한 날, 당일은 D-Day</desc><rect width="800" height="346" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">D- 와 D+ 의 차이</text><rect x="40.0" y="86" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="155.33333333333331" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">D-</text><text x="155.33333333333331" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">남은 날</text><text x="155.33333333333331" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">목표일까지</text><rect x="284.7" y="86" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="399.99999999999994" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">D-Day</text><text x="399.99999999999994" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">당일</text><text x="399.99999999999994" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">목표일</text><rect x="529.3" y="86" width="230.7" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="644.6666666666666" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">D+</text><text x="644.6666666666666" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">지난 날</text><text x="644.6666666666666" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">목표일 이후</text><text x="40" y="246" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">1000일째는 첫날을 1일로 세면 999일 뒤예요.</text><text x="40" y="272" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">