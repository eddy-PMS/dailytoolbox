400" fill="#1e47a8" text-anchor="start">+8.3%</text><text x="40" y="500" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">조건: 10,000원에 100주 보유, 현재가 6,000원.</text><text x="40" y="544" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>