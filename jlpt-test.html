<main>
  <div class="brand"><b>日</b> 일본어 JLPT 레벨 테스트</div>
  <h1>일본어 단어 20개로 알아보는 내 어휘 수준</h1>
  <p class="sub">N5 수준부터 N1/실무 어휘까지 4단계, 총 20문제입니다. 5분이면 끝나요.</p>

  <div id="startScreen">
    <div class="start-card">
      <p>단어의 뜻을 보기 중에서 고르면 돼요.<br>모르는 문제는 편하게 찍고 넘어가셔도 됩니다.</p>
      <button class="start-btn" id="startBtn">테스트 시작하기</button>
    </div>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="progress-row">
      <span id="progressText">1 / 20</span>
      <span id="tierLabel"></span>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>

    <div class="question-card">
      <span class="tier-badge" id="tierBadge"></span>
      <div class="word-display">
        <div class="kanji" id="kanjiDisplay"></div>
        <div class="reading" id="readingDisplay"></div>
      </div>
      <div class="options" id="optionsWrap"></div>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-card">
      <div class="result-headline" id="resultHeadline"></div>
      <p class="result-sub" id="resultSub"></p>
      <div class="tier-bars" id="tierBars"></div>
      <button class="retry-btn" id="retryBtn">다시 테스트하기</button>
    </div>
  </div>

  <footer>
    이 테스트는 20개 표본 문항으로 어휘 수준을 대략적으로 가늠해보는 참고용 진단입니다.<br>
    JLPT 공인 시험 점수를 대체하지 않아요.
  </footer>
</main>

<script>
  const TIERS = ['N5', 'N4~N3', 'N2', 'N1/실무'];

  const QUESTIONS = [
    // N5
    { tier: 'N5', word: '学校', reading: 'がっこう', correct: '학교', options: ['학교', '회사', '병원', '공원'] },
    { tier: 'N5', word: '天気', reading: 'てんき', correct: '날씨', options: ['계절', '날씨', '기온', '바람'] },
    { tier: 'N5', word: '朝', reading: 'あさ', correct: '아침', options: ['아침', '저녁', '밤', '점심'] },
    { tier: 'N5', word: '家族', reading: 'かぞく', correct: '가족', options: ['이웃', '가족', '친구', '동료'] },
    { tier: 'N5', word: '借りる', reading: 'かりる', correct: '빌리다', options: ['빌리다', '빌려주다', '사다', '갚다'] },
    // N4~N3
    { tier: 'N4~N3', word: '機会', reading: 'きかい', correct: '기회', options: ['위기', '기회', '문제', '결과'] },
    { tier: 'N4~N3', word: '達成する', reading: 'たっせいする', correct: '달성하다', options: ['포기하다', '달성하다', '연기하다', '시작하다'] },
    { tier: 'N4~N3', word: '環境', reading: 'かんきょう', correct: '환경', options: ['경제', '환경', '정치', '사회'] },
    { tier: 'N4~N3', word: '目的', reading: 'もくてき', correct: '목적', options: ['방법', '목적', '원인', '결과'] },
    { tier: 'N4~N3', word: '避ける', reading: 'さける', correct: '피하다', options: ['찾다', '피하다', '마주하다', '고르다'] },
    // N2
    { tier: 'N2', word: '曖昧', reading: 'あいまい', correct: '애매한', options: ['명확한', '애매한', '확실한', '단순한'] },
    { tier: 'N2', word: '矛盾', reading: 'むじゅん', correct: '모순', options: ['일치', '모순', '조화', '균형'] },
    { tier: 'N2', word: '慎重', reading: 'しんちょう', correct: '신중한', options: ['경솔한', '신중한', '급한', '단순한'] },
    { tier: 'N2', word: '妥当', reading: 'だとう', correct: '타당한', options: ['부당한', '타당한', '과도한', '불필요한'] },
    { tier: 'N2', word: '不可欠', reading: 'ふかけつ', correct: '필수적인', options: ['불필요한', '필수적인', '선택적인', '드문'] },
    // N1/실무
    { tier: 'N1/실무', word: '償還', reading: 'しょうかん', correct: '상환', options: ['할인', '상환', '연체', '보증'] },
    { tier: 'N1/실무', word: '請求書', reading: 'せいきゅうしょ', correct: '청구서', options: ['영수증', '청구서', '계약서', '견적서'] },
    { tier: 'N1/실무', word: '交渉する', reading: 'こうしょうする', correct: '협상하다', options: ['협상하다', '거절하다', '승인하다', '보고하다'] },
    { tier: 'N1/실무', word: '利害関係者', reading: 'りがいかんけいしゃ', correct: '이해관계자', options: ['경쟁사', '이해관계자', '하청업체', '감사관'] },
    { tier: 'N1/실무', word: '子会社', reading: 'こがいしゃ', correct: '자회사', options: ['본사', '자회사', '지주회사', '협력업체'] }
  ];

  let current = 0;
  let answered = false;
  const scoreByTier = {};
  TIERS.forEach(t => scoreByTier[t] = 0);

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderQuestion() {
    answered = false;
    const q = QUESTIONS[current];
    document.getElementById('progressText').textContent = (current + 1) + ' / ' + QUESTIONS.length;
    document.getElementById('progressFill').style.width = ((current) / QUESTIONS.length * 100) + '%';
    document.getElementById('tierLabel').textContent = q.tier + ' 단계';
    document.getElementById('tierBadge').textContent = q.tier;
    document.getElementById('kanjiDisplay').textContent = q.word;
    document.getElementById('readingDisplay').textContent = q.reading;

    const wrap = document.getElementById('optionsWrap');
    wrap.innerHTML = '';
    const shuffled = shuffle(q.options);
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectOption(btn, opt, q));
      wrap.appendChild(btn);
    });
  }

  function selectOption(btn, opt, q) {
    if (answered) return;
    answered = true;
    const isCorrect = opt === q.correct;
    if (isCorrect) {
      btn.classList.add('correct');
      scoreByTier[q.tier]++;
    } else {
      btn.classList.add('wrong');
      [...document.getElementById('optionsWrap').children].forEach(b => {
        if (b.textContent === q.correct) b.classList.add('correct');
      });
    }
    [...document.getElementById('optionsWrap').children].forEach(b => b.disabled = true);

    setTimeout(() => {
      current++;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }, 700);
  }

  function showResult() {
    quizScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');

    const totalCorrect = Object.values(scoreByTier).reduce((a, b) => a + b, 0);
    const questionsPerTier = 5;

    let levelIdx = -1;
    for (let i = TIERS.length - 1; i >= 0; i--) {
      if (scoreByTier[TIERS[i]] >= 3) { levelIdx = i; break; }
    }

    let headline, sub;
    if (levelIdx === 3) {
      headline = 'N1/실무 어휘까지 탄탄해요';
      sub = '비즈니스 수준의 일본어 어휘도 잘 알고 계세요. 더 넓은 어휘로 확장해보시면 좋겠어요.';
    } else if (levelIdx === 2) {
      headline = 'N2 수준';
      sub = 'N2 수준의 어휘를 잘 알고 계세요. N1과 실무 어휘로 넘어가실 준비가 됐어요.';
    } else if (levelIdx === 1) {
      headline = 'N4~N3 수준';
      sub = '일상적인 표현은 탄탄해요. N2 수준 어휘로 넘어갈 준비가 된 단계예요.';
    } else if (levelIdx === 0) {
      headline = 'N5 수준';
      sub = '기본기가 잡혀 있어요. N4~N3 어휘부터 차근차근 늘려가시면 좋겠어요.';
    } else {
      headline = '일본어 어휘를 막 시작하는 단계';
      sub = 'N5 단어부터 하나씩 쌓아가시면 금방 늘어요.';
    }

    document.getElementById('resultHeadline').textContent = headline + ` (총 ${totalCorrect}/20)`;
    document.getElementById('resultSub').textContent = sub;

    const barsWrap = document.getElementById('tierBars');
    barsWrap.innerHTML = '';
    TIERS.forEach(tier => {
      const correct = scoreByTier[tier];
      const pct = (correct / questionsPerTier) * 100;
      const row = document.createElement('div');
      row.innerHTML = `
        <div class="tier-bar-label"><span>${tier}</span><span>${correct} / ${questionsPerTier}</span></div>
        <div class="tier-bar-track"><div class="tier-bar-fill" style="width:${pct}%"></div></div>
      `;
      barsWrap.appendChild(row);
    });

    if (typeof gtag === 'function') {
      gtag('event', 'jlpt_level_test_completed', { total_correct: totalCorrect, level_tier: TIERS[levelIdx] || 'below_n5' });
    }
  }

  function startQuiz() {
    current = 0;
    TIERS.forEach(t => scoreByTier[t] = 0);
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    renderQuestion();
  }

  startBtn.addEventListener('click', startQuiz);
  retryBtn.addEventListener('click', startQuiz);
</script>
