<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img"><title>IP 추적으로 알 수 있는 범위</title><desc>국가는 거의 정확, 지역·도시는 근사치, 통신사·AS 번호 확인 가능 — 개인 신원·주소는 알 수 없다</desc><rect width="800" height="406" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">IP 추적으로 알 수 있는 범위</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">알 수 있음</text><text x="400" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">알 수 없음</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">국가 (거의 정확)</text><text x="400" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">이름·전화번호 등 개인 신원</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">지역·도시 (근사치)</text><text x="400" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">정확한 주소, 동·호수</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">통신사(ISP)와 AS 번호</text><text x="400" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">누가 그 회선을 쓰는지</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">회선 종류(가정용·기업·VPN 등)</text><text x="400" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">기기 종류나 쓰는 사람 수</text><text x="40" y="376" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>