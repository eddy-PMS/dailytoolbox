<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><title>가산수당 정리 (5인 이상 사업장)</title><desc>연장·야간·휴일 근로는 시급의 50% 추가, 연장과 야간이 겹치면 100% 추가</desc><rect width="800" height="500" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">가산수당 정리 (5인 이상 사업장)</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">연장·야간·휴일에 일하면 시급에 더 붙는 돈</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구분</text><text x="220" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">기준</text><text x="610" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">가산</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">연장근로</text><text x="220" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1일 8시간 또는 1주 40시간 초과</text><text x="610" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50% 추가</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">야간근로</text><text x="220" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">오후 10시 ~ 오전 6시 근무</text><text x="610" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50% 추가</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">휴일근로</text><text x="220" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">주휴일·공휴일 (8시간 이내)</text><text x="610" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50% 추가</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">연장 + 야간</text><text x="220" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">둘 다 해당</text><text x="610" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">100% 추가</text><text x="40" y="400" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">5인 미만 사업장은 가산수당 의무가 없어요.</text><text x="40" y="426" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">최저임금·주휴수당·퇴직금(1년 이상)은 규모와 관계없이 적용됩니다.</text><text x="40" y="470" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>