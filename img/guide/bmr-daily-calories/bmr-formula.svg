<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>기초대사량 계산 공식</title><desc>미플린-세인트 지어 공식: 남성은 +5, 여성은 −161</desc><rect width="800" height="420" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">기초대사량 계산 공식</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">미플린-세인트 지어 공식</text><rect x="40" y="120" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="154" r="20" fill="#2b5fd9"/><text x="80" y="161" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="160" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">남성</text><text x="118" y="192" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">10 × 몸무게(kg) + 6.25 × 키(cm) − 5 × 나이 + 5</text><rect x="40" y="224" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="258" r="20" fill="#2b5fd9"/><text x="80" y="265" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="264" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">여성</text><text x="118" y="296" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">10 × 몸무게(kg) + 6.25 × 키(cm) − 5 × 나이 − 161</text><text x="40" y="346" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">키와 몸무게가 같으면 남녀 차이는 항상 166kcal예요.</text><text x="40" y="390" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>