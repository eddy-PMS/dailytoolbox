<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" role="img"><title>평단가 계산법</title><desc>평단가는 총 매수금액을 총 수량으로 나눈 값</desc><rect width="800" height="296" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">평단가 계산법</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">평단가 = 총 매수금액 ÷ 총 수량</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 10,000원에 100주 + 6,000원에 100주</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">(100만원 + 60만원) ÷ 200주 = 8,000원</text><text x="40" y="266" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>