<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" role="img"><title>할인 전 가격 역계산</title><desc>할인 전 가격 = 할인가 ÷ (1 − 할인율). 6,720원이 60% 할인가면 정가 16,800원</desc><rect width="800" height="584" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">할인 전 가격 역계산</text><rect x="40" y="86" width="720" height="106" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">할인 전 가격 = 할인가 ÷ (1 − 할인율)</text><text x="66" y="176" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">예) 6,720원 ÷ (1 − 0.6) = 16,800원</text><rect x="40" y="216" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">할인가</text><text x="290" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">할인율</text><text x="480" y="245" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">할인 전 가격</text><rect x="40" y="260" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="292" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4,985원</text><text x="290" y="292" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">50%</text><text x="480" y="292" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">9,970원</text><rect x="40" y="310" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="342" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">6,720원</text><text x="290" y="342" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">60%</text><text x="480" y="342" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">16,800원</text><rect x="40" y="360" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="392" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">19,900원</text><text x="290" y="392" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">50%</text><text x="480" y="392" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">39,800원</text><rect x="40" y="410" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="442" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">35,000원</text><text x="290" y="442" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">30%</text><text x="480" y="442" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">50,000원</text><rect x="40" y="460" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="492" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">41,300원</text><text x="290" y="492" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">30%</text><text x="480" y="492" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">59,000원</text><text x="40" y="554" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>