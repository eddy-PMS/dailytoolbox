<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>망각곡선에 대한 흔한 오해</title><desc>망각곡선 수치는 잊는 비율이 아니고, 복습 주기를 정한 연구도 아니다</desc><rect width="800" height="560" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">망각곡선에 대한 흔한 오해</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">“20분 뒤에 42%를 잊는다”</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">표의 숫자는 기억하는 비율이 아니라 절약률</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">“에빙하우스가 복습 주기를 정했다”</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">잊는 속도를 쟀을 뿐, 복습 효과는 조사하지 않았어요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">단어 외우기와 조건이 달라요</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">뜻이 없는 음절 — 실제 영단어는 훨씬 잘 붙어요</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">한 사람의 데이터예요</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">두 연구 모두 피험자 한 명 — 31일 값이 21%와 4%</text><text x="40" y="530" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>