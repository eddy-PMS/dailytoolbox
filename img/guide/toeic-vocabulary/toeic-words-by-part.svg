<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" role="img"><title>파트별로 단어가 걸리는 지점</title><desc>Part 5는 비슷한 뜻 고르기, Part 7은 계약·배송·환불·채용 명사</desc><rect width="800" height="768" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">파트별로 단어가 걸리는 지점</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 1 · 사진 속 동작·사물</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">자세·위치를 나타내는 동사와 전치사구</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 2 · 짧은 질문과 대답</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">질문의 첫 단어, 되묻기·거절 표현</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 3·4 · 사무실 대화, 안내 방송, 사내 공지</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">일정 변경·예약·설비 점검 관련 명사</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 5 · 한 문장 빈칸</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">비슷한 뜻 중 고르기, 명사·동사·형용사 짝</text><rect x="40" y="502" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="536" r="20" fill="#2b5fd9"/><text x="80" y="543" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="542" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 6 · 이메일·공지 안의 빈칸</text><text x="118" y="574" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">앞뒤 문장을 잇는 접속 표현</text><rect x="40" y="606" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="640" r="20" fill="#2b5fd9"/><text x="80" y="647" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="118" y="646" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">Part 7 · 이메일·송장·일정표·기사</text><text x="118" y="678" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">계약·배송·환불·채용에 쓰는 명사</text><text x="40" y="738" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>