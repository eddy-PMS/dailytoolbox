<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" role="img"><title>도장 이미지, 어디에 쓸 수 있나</title><desc>보고서·발표 자료 꾸미기는 되고, 인감증명 서류·계약서 날인에는 쓰면 안 된다</desc><rect width="800" height="476" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">도장 이미지, 어디에 쓸 수 있나</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">여기서 만든 것은 그림 파일이에요. 법적 효력이 없어요.</text><rect x="40" y="120" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="154" r="20" fill="#2b5fd9"/><text x="80" y="161" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="160" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">써도 되는 곳</text><text x="118" y="192" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보고서·안내문·발표 자료 꾸미기, 사내 확인 표시</text><text x="118" y="220" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">블로그·SNS 이미지, 개인 메모 서식</text><rect x="40" y="252" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="286" r="20" fill="#2b5fd9"/><text x="80" y="293" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="292" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">쓰면 안 되는 곳</text><text x="118" y="324" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">인감증명이 필요한 서류, 은행 제출 서류</text><text x="118" y="352" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">관공서 민원 서류, 계약서의 날인</text><text x="40" y="402" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">남의 이름이나 회사 이름으로 만들어 문서에 쓰지 마세요.</text><text x="40" y="446" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>