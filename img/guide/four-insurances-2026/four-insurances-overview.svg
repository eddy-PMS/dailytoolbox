<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img"><title>4대보험, 무엇을 대비하고 누가 내나</title><desc>국민연금·건강보험·고용보험·산재보험이 대비하는 것과 내는 사람</desc><rect width="800" height="700" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">4대보험, 무엇을 대비하고 누가 내나</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">국민연금</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대비: 노후·장애·사망(연금)</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로자 절반 · 사업주 절반</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">건강보험(+장기요양)</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대비: 병원비, 노인 장기요양</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로자 절반 · 사업주 절반</text><rect x="40" y="350" width="720" height="146" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">고용보험</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대비: 실직(실업급여), 육아휴직, 직업훈련</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로자 실업급여분 절반 · 사업주 실업급여분 절반 + 고용안정분</text><text x="118" y="478" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">전액</text><rect x="40" y="510" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="544" r="20" fill="#2b5fd9"/><text x="80" y="551" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="550" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">산재보험</text><text x="118" y="582" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">대비: 일하다 다치거나 병든 경우</text><text x="118" y="610" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로자 없음 · 사업주 전액</text><text x="40" y="670" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>