<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" role="img"><title>BMI 계산 공식</title><desc>BMI는 몸무게(kg)를 키(m)의 제곱으로 나눈 값. 예: 172cm 74kg이면 25.0</desc><rect width="800" height="364" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">BMI 계산 공식</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">몸무게(kg)를 키(m)의 제곱으로 나눈 값</text><rect x="40" y="120" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="166" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">BMI = 몸무게(kg) ÷ 키(m)²</text><text x="66" y="210" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 키 172cm, 몸무게 74kg</text><text x="66" y="242" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">74 ÷ (1.72 × 1.72) = 25.0  →  1단계 비만</text><text x="40" y="290" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">대한비만학회 기준: 23 이상 과체중, 25 이상 비만 (서양 기준 25·30보다 낮음)</text><text x="40" y="334" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>