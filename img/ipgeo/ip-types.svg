<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>IP 종류와 위치 정확도</title><desc>가정용은 도시 단위 근사치, 모바일은 게이트웨이 위치, 데이터센터는 서버 위치, 사설 IP는 조회 불가</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">IP 종류와 위치 정확도</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">구분</text><text x="290" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">특징</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">가정용(통신사)</text><text x="290" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">도시 단위 근사치, 서울로 뭉뚱그려지기도</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">모바일</text><text x="290" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">통신사 게이트웨이 위치로 표시</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">데이터센터·클라우드</text><text x="290" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">서버 위치, 봇·크롤러일 가능성</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">VPN·프록시</text><text x="290" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">실제 사용자 위치와 무관</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">사설 IP (192.168.x.x 등)</text><text x="290" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">인터넷 상 위치 없음, 조회 불가</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>