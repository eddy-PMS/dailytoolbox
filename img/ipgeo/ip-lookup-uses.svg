<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>IP 주소 조회, 이럴 때 써요</title><desc>스팸 메일 발신지, 서버 접속 로그, 해외 로그인 알림, 차단된 IP 확인</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">IP 주소 조회, 이럴 때 써요</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">상황</text><text x="290" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">무엇을 보나</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">스팸·피싱 메일</text><text x="290" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">메일 헤더 발신 IP의 국가</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">서버 접속 로그</text><text x="290" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">반복 접속 IP가 데이터센터·봇인지</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">해외 로그인 알림</text><text x="290" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">알림에 적힌 IP가 어느 나라인지</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">게임·서비스 서버</text><text x="290" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">서버가 어느 지역에 있는지</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">차단된 IP 문의</text><text x="290" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">차단 안내의 IP가 내 회선인지</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>