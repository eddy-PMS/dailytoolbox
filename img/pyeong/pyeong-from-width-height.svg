<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>가로 세로로 평수 구하기</title><desc>가로 4m 세로 5m는 20㎡ 6.05평, 6m × 7.44m는 44.64㎡ 13.5평</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">가로 세로로 평수 구하기</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">㎡ = 가로(m) × 세로(m) · 평 = ㎡ ÷ 3.305785</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">가로 × 세로</text><text x="330" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">㎡</text><text x="560" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">평</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3m × 4m</text><text x="330" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">12㎡</text><text x="560" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">3.63평</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4m × 5m</text><text x="330" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">20㎡</text><text x="560" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">6.05평</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5m × 6m</text><text x="330" y="298" font-size="18" font-wei