<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" role="img"><title>헷갈리는 히라가나 묶음</title><desc>さ와 ち, ぬ와 め, ね·れ·わ 등 헷갈리는 히라가나 구별하는 점</desc><rect width="800" height="976" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">헷갈리는 히라가나 묶음</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">さ(사) / ち(치)</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">아래 곡선이 さ는 왼쪽으로, ち는 오른쪽으로 불룩해요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">さ(사) / き(키)</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">가로획이 さ는 1개, き는 2개</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ぬ(누) / め(메)</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">끝이 동그랗게 말리면 ぬ, 그냥 빠지면 め</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">ね(네) / れ(레) / わ(와)</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">끝이 말리면 ね, 바깥으로 튀면 れ, 안으로 둥글게 닫히면 わ</text><rect x="40" y="502" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="536" r="20" fill="#2b5fd9"/><text x="80" y="543" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="542" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">る(루) / ろ(로)</text><text x="118" y="574" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">끝에 고리가 있으면 る, 없으면 ろ</text><rect x="40" y="606" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="640" r="20" fill="#2b5fd9"/><text x="80" y="647" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="118" y="646" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">は(하) / ほ(호)</text><text x="118" y="678" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">오른쪽 위 가로획이 は는 1개, ほ는 2개</text><rect x="40" y="710" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="744" r="20" fill="#2b5fd9"/><text x="80" y="751" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="118" y="750" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">い(이) / り(리)</text><text x="118" y="782" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">い는 왼쪽 획이 길고, り는 오른쪽 획이 길어요</text><rect x="40" y="814" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="848" r="20" fill="#2b5fd9"/><text x="80" y="855" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">8</text><text x="118" y="854" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">あ(아) / お(오)</text><text x="118" y="886" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">お는 오른쪽 위에 점이 따로 있어요</text><text x="40" y="946" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>