<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" role="img"><title>주휴수당 조건 두 가지</title><desc>주 15시간 이상이고 소정근로일을 개근해야 주휴수당이 발생</desc><rect width="800" height="408" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">주휴수당 조건 두 가지</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">주 15시간 이상</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4주를 평균해 1주 소정근로시간이 15시간 이상</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로기준법 제18조 제3항</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">개근</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">1주 동안의 소정근로일에 모두 출근</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">근로기준법 시행령 제30조</text><text x="40" y="378" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>