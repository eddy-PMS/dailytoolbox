<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img"><title>성조만 다른 쌍은 나란히</title><desc>买 mǎi 3성 사다, 卖 mài 4성 팔다 — 성조만 다른 쌍</desc><rect width="800" height="320" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">성조만 다른 쌍은 나란히</text><rect x="40.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="216.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">买 · 사다</text><text x="216.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">mǎi</text><text x="216.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">3성</text><rect x="407.0" y="86" width="353.0" height="128" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><text x="583.5" y="118" font-size="17" font-weight="700" fill="#5b6472" text-anchor="middle">卖 · 팔다</text><text x="583.5" y="162" font-size="27" font-weight="800" fill="#2b5fd9" text-anchor="middle">mài</text><text x="583.5" y="194" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">4성</text><text x="40" y="246" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">따로 외우면 계속 헷갈려요. 한 줄에 나란히 놓고 묶어서 외워요.</text><text x="40" y="290" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>