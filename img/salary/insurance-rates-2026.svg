<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img"><title>2026년 4대보험 요율 (근로자 부담분)</title><desc>국민연금 4.75%, 건강보험 3.595%, 장기요양 건강보험료의 13.14%, 고용보험 0.9%</desc><rect width="800" height="466" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">2026년 4대보험 요율 (근로자 부담분)</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">항목</text><text x="230" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">요율</text><text x="470" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">비고</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">국민연금</text><text x="230" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">4.75%</text><text x="470" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">상한 659만원 · 하한 41만원</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">건강보험</text><text x="230" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">3.595%</text><text x="470" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">2026년 동결</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">장기요양보험</text><text x="230" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">건강보험료의 13.14%</text><text x="470" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">건강보험료에 곱해서 계산</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">고용보험</text><text x="230" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">0.9%</text><text x="470" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">실업급여 계정</text><text x="40" y="366" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">국민연금은 2026년부터 4.5% → 4.75%. 상한액이 있어 월 659만원 넘게 벌어도 더 늘지 않아요.</text><text x="40" y="392" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">산재보험은 회사가 전액 부담합니다.</text><text x="40" y="436" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>