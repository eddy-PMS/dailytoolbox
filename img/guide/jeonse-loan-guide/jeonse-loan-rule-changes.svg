<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>최근 달라진 전세대출 규제</title><desc>2025년 6월 소유권 이전 조건부 금지, 7월 보증비율 80%, 9월 1주택자 한도 2억원, 10월 DSR 반영</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">최근 달라진 전세대출 규제</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">수도권·규제지역 대상</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">시행일</text><text x="220" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">내용</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2025.6.28</text><text x="220" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">소유권 이전 조건부 전세대출 금지</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2025.7.21</text><text x="220" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전세대출 보증비율 90% → 80%</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2025.9.8</text><text x="220" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">1주택자 전세대출 한도 2억원으로 일원화</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2025.10.29</text><t