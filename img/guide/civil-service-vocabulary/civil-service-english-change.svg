<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>공무원 영어, 무엇이 바뀌었나</title><desc>지식암기 위주에서 현장 직무 중심으로 — 2025년부터 적용</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">공무원 영어, 무엇이 바뀌었나</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">인사혁신처 2023.11.20 발표 · 2025년부터 적용</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">전에 통했던 방식</text><text x="400" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">지금 맞는 방향</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">난도 높은 어휘를 폭넓게 외우기</text><text x="400" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">업무 문서에 실제로 쓰이는 어휘</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">단어 하나의 뜻을 깊게</text><text x="400" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">문서 안에서 쓰임을 함께</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">문학·학술 지문 어휘</text><text x="400" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전자메일·안내문·공지 어휘</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">분량으로 승부</text