<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img"><title>월세 복비, 거래금액 구하는 법</title><desc>임대차 거래금액은 보증금 + 월세 × 100, 5천만원 미만이면 월세 × 70</desc><rect width="800" height="484" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">월세 복비, 거래금액 구하는 법</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">임대차 거래금액</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">보증금 + (월세 × 100)</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">그 값이 5천만원 미만이면</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">월세 × 70 을 써요</text><rect x="40" y="294" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">누가 내나요</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">매매는 매도인·매수인, 임대차는 임대인·임차인이 각각</text><text x="118" y="394" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">표의 요율은 한쪽이 내는 금액 기준</text><text x="40" y="454" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>