<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img"><title>이런 주에는 주휴수당이 나올까</title><desc>지각·조퇴는 발생, 무단결근은 미발생</desc><rect width="800" height="456" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">이런 주에는 주휴수당이 나올까</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">그 주의 상황</text><text x="430" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">주휴수당</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">근무일 모두 출근</text><text x="430" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">발생</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">지각·조퇴·외출이 있었음</text><text x="430" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">발생 (결근 아님)</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">연차휴가를 쓴 날이 있음</text><text x="430" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">나머지 근무일을 개근하면 발생</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">근무일 중 하루 무단결근</text><text x="430" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">미발생</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">약속한 근무일이 아닌 날 쉼</text><text x="430" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">영향 없음</text><text x="40" y="426" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>