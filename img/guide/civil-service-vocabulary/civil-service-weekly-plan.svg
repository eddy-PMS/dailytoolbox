<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>시험까지 주차별 배분</title><desc>6개월 전까지 하루 15~20개, 3개월 전 10개, 1개월 전부터 추가 없음</desc><rect width="800" height="440" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">시험까지 주차별 배분</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">시험까지 남은 기간별</text><rect x="40" y="122" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">시기</text><text x="175" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">새 단어</text><text x="455" y="151" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">복습</text><rect x="40" y="166" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="198" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">6개월 전까지</text><text x="175" y="198" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">하루 15~20개</text><text x="455" y="198" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">전날 + 사나흘 전</text><rect x="40" y="216" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3개월 전</text><text x="175" y="248" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">하루 10개, 기출에서 나온 것만</text><text x="455" y="248" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">목록 전체 1회독</text><rect x="40" y="266" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="298" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1개월 전</text><text x="175" y="298" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">추가 없음</text><text x="455" y="298" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">틀린 것만 남은 목록</text><rect x="40" y="316" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="348" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2주 전</text><text x="175" y="348" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">없음</text><text x="455" y="348" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">압축 목록 반복, 예시문제·기출 재확인</text><text x="40" y="410" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>