<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img"><title>간격 반복 — 회차마다 목록이 줄어요</title><desc>300개로 시작해 회차마다 틀린 것만 보면 약 150, 80, 40, 20개로 준다</desc><rect width="800" height="458" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">간격 반복 — 회차마다 목록이 줄어요</text><text x="40" y="96" font-size="18" font-weight="400" fill="#5b6472" text-anchor="start">예: 300개로 시작, 회차마다 틀린 것만 다시</text><text x="40" y="152" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">1회차</text><rect x="150" y="130" width="370.0" height="30" rx="6" fill="#2b5fd9"/><text x="532.0" y="152" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">300개</text><text x="40" y="200" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">2회차</text><rect x="150" y="178" width="185.0" height="30" rx="6" fill="#2b5fd9"/><text x="347.0" y="200" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">약 150개</text><text x="40" y="248" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">3회차</text><rect x="150" y="226" width="98.7" height="30" rx="6" fill="#2b5fd9"/><text x="260.6666666666667" y="248" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">약 80개</text><text x="40" y="296" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">4회차</text><rect x="150" y="274" width="49.3" height="30" rx="6" fill="#2b5fd9"/><text x="211.33333333333334" y="296" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">약 40개</text><text x="40" y="344" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">5회차</text><rect x="150" y="322" width="24.7" height="30" rx="6" fill="#2b5fd9"/><text x="186.66666666666666" y="344" font-size="18" font-weight="700" fill="#1e47a8" text-anchor="start">약 20개</text><text x="40" y="384" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">회차별 보는 것: 1 전부 · 2~4 직전 회차에 틀린 것 · 5 끝까지 틀린 것</text><text x="40" y="428" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>