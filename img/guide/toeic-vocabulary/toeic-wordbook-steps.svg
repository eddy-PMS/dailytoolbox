<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" role="img"><title>토익 단어장 만드는 순서</title><desc>기출 풀기, 틀린 지문 읽기, 단어 뽑기, 아는 단어 지우기, 네 칸 정리, 파트 표시</desc><rect width="800" height="768" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">토익 단어장 만드는 순서</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">기출·모의를 한 회 푼다</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">무엇을 모르는지 알아야 목록이 생겨요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">틀린 문항의 지문을 다시 읽는다</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">단어 때문에 틀린 것만 가져와요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">지문에서 단어를 뽑는다</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">지문을 붙여 넣어 목록으로</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">이미 아는 단어를 지운다</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">뽑힌 목록의 절반 이상은 이미 아는 단어</text><rect x="40" y="502" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="536" r="20" fill="#2b5fd9"/><text x="80" y="543" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="542" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">네 칸으로 정리한다</text><text x="118" y="574" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">단어 / 뜻 / 같이 쓰는 짝 / 나온 문장</text><rect x="40" y="606" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="640" r="20" fill="#2b5fd9"/><text x="80" y="647" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="118" y="646" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">파트 표시를 남긴다</text><text x="118" y="678" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">Part 7은 눈으로, Part 3은 귀로 복습</text><text x="40" y="738" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>