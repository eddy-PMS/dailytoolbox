<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img"><title>전월세 전환율 계산</title><desc>보증금 1억원을 전환율 5.0%로 바꾸면 월 약 41.7만원</desc><rect width="800" height="356" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">전월세 전환율 계산</text><rect x="40" y="86" width="720" height="138" rx="14" fill="#ffffff" stroke="#2b5fd9" stroke-width="3"/><text x="66" y="132" font-size="26" font-weight="800" fill="#1e47a8" text-anchor="start">월세 = 전환할 보증금 × 전환율 ÷ 12</text><text x="66" y="176" font-size="19" font-weight="400" fill="#151a23" text-anchor="start">예) 보증금 1억원 · 전환율 5.0%</text><text x="66" y="208" font-size="19" font-weight="800" fill="#1e47a8" text-anchor="start">1억 × 5.0% ÷ 12 = 월 약 41.7만원</text><text x="40" y="256" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">갱신 계약의 전환율 상한은 '한국은행 기준금리 + 2%p'와 '연 10%' 중 낮은 값이에요.</text><text x="40" y="282" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">기준금리 연 3.00%(2026년 8월 27일 이후)이면 상한 5.0%.</text><text x="40" y="326" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>