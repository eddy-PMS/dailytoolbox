<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>JLPT 합격 기준 (180점 만점)</title><desc>N1 100점, N2 90점, N3 95점, N4 90점, N5 80점 이상이고 과목별 기준점을 넘어야 합격</desc><rect width="800" height="490" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">JLPT 합격 기준 (180점 만점)</text><rect x="40" y="88" width="720" height="44" rx="10" fill="#2b5fd9"/><text x="58" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">등급</text><text x="150" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">합격점</text><text x="280" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">과목별 기준점</text><rect x="40" y="132" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="164" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N1</text><text x="150" y="164" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">100점</text><text x="280" y="164" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">언어지식 · 독해 · 청해 각 60점 중 19점</text><rect x="40" y="182" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="214" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N2</text><text x="150" y="214" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">90점</text><text x="280" y="214" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">언어지식 · 독해 · 청해 각 60점 중 19점</text><rect x="40" y="232" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="264" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N3</text><text x="150" y="264" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">95점</text><text x="280" y="264" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">언어지식 · 독해 · 청해 각 60점 중 19점</text><rect x="40" y="282" width="720" height="50" fill="#f2f7fe" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="314" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N4</text><text x="150" y="314" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">90점</text><text x="280" y="314" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">언어지식·독해 120점 중 38점, 청해 19점</text><rect x="40" y="332" width="720" height="50" fill="#ffffff" stroke="#e3e9f3" stroke-width="1"/><text x="58" y="364" font-size="18" font-weight="700" fill="#151a23" text-anchor="start">N5</text><text x="150" y="364" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">80점</text><text x="280" y="364" font-size="18" font-weight="400" fill="#1e47a8" text-anchor="start">언어지식·독해 120점 중 38점, 청해 19점</text><text x="40" y="416" font-size="16" font-weight="400" fill="#5b6472" text-anchor="start">총점이 합격점을 넘어도 기준점에 못 미치는 과목이 있으면 불합격이에요.</text><text x="40" y="460" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>