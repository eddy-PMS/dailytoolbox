<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>사인 잘 만드는 요령</title><desc>획은 3~5개, 성은 크게 이름은 흘려서, 첫 글자를 크게, 획 두께 3~6</desc><rect width="800" height="560" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">사인 잘 만드는 요령</text><rect x="40" y="86" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">획은 3~5개</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">너무 복잡하면 매번 다르게 그려져요</text><rect x="40" y="190" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="224" r="20" fill="#2b5fd9"/><text x="80" y="231" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="230" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">성은 크게, 이름은 흘려서</text><text x="118" y="262" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">알아보기 쉬우면서 빨라요</text><rect x="40" y="294" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="328" r="20" fill="#2b5fd9"/><text x="80" y="335" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="334" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">첫 글자를 크게 시작</text><text x="118" y="366" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">서명다운 흐름이 생겨요</text><rect x="40" y="398" width="720" height="90" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="432" r="20" fill="#2b5fd9"/><text x="80" y="439" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="438" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">직접 그릴 때 획 두께 3~6</text><text x="118" y="470" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">너무 얇으면 작게 넣었을 때 사라져요</text><text x="40" y="530" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>