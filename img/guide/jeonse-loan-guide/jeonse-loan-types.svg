<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 804" role="img"><title>전세대출 종류 — 은행 재원과 버팀목</title><desc>은행 재원 전세대출과 주택도시기금 버팀목의 재원·금리·요건·담보 차이</desc><rect width="800" height="804" rx="16" fill="#f2f7fe"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif"><text x="40" y="62" font-size="28" font-weight="800" fill="#151a23" text-anchor="start">전세대출 종류 — 은행 재원과 버팀목</text><rect x="40" y="86" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="120" r="20" fill="#2b5fd9"/><text x="80" y="127" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="118" y="126" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">재원</text><text x="118" y="158" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">은행 재원: 은행 자체 자금</text><text x="118" y="186" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">버팀목: 주택도시기금(정부)</text><rect x="40" y="218" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="252" r="20" fill="#2b5fd9"/><text x="80" y="259" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="118" y="258" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">금리</text><text x="118" y="290" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">은행 재원: 은행·시기·신용에 따라 다름</text><text x="118" y="318" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">버팀목: 국토교통부 고시 금리표</text><rect x="40" y="350" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="384" r="20" fill="#2b5fd9"/><text x="80" y="391" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="118" y="390" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">소득·자산 요건</text><text x="118" y="422" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">은행 재원: 상품과 보증기관 기준에 따름</text><text x="118" y="450" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">버팀목: 부부합산 소득·순자산 상한 있음</text><rect x="40" y="482" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="516" r="20" fill="#2b5fd9"/><text x="80" y="523" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="118" y="522" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">대상 주택</text><text x="118" y="554" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">은행 재원: 보증기관 기준의 보증금 이하</text><text x="118" y="582" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">버팀목: 전용 85㎡ 이하, 보증금 상한 있음</text><rect x="40" y="614" width="720" height="118" rx="14" fill="#ffffff" stroke="#e3e9f3" stroke-width="2"/><circle cx="80" cy="648" r="20" fill="#2b5fd9"/><text x="80" y="655" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="118" y="654" font-size="20" font-weight="800" fill="#151a23" text-anchor="start">담보</text><text x="118" y="686" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">은행 재원: HF·HUG·SGI 보증서</text><text x="118" y="714" font-size="18" font-weight="400" fill="#151a23" text-anchor="start">버팀목: HF·HUG 보증서 또는 채권양도</text><text x="40" y="774" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">dailyfreetoolbox.com</text></g></svg>